<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Impact Shooter - Juiced Up!</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Orbitron', 'Arial', sans-serif;
            background: linear-gradient(135deg, #0a0e2a, #1a1f3a);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }
        
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        
        h1 {
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 10px #00f7ff, 0 0 20px #00a1ff;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        
        canvas {
            border: 3px solid #00f7ff;
            background: radial-gradient(circle, #0a0e2a 0%, #00041a 100%);
            box-shadow: 0 0 20px rgba(0, 247, 255, 0.5), inset 0 0 20px rgba(0, 247, 255, 0.1);
            margin: 10px 0;
        }
        
        .game-ui {
            width: 100%;
            max-width: 600px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(0, 247, 255, 0.3);
            box-shadow: 0 0 10px rgba(0, 247, 255, 0.2);
            margin-bottom: 15px;
        }
        
        .score-health {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-family: 'Orbitron', sans-serif;
        }
        
        .score, .health {
            padding: 8px 15px;
            background: rgba(0, 247, 255, 0.1);
            border-radius: 5px;
            border: 1px solid #00f7ff;
            text-shadow: 0 0 5px #00f7ff;
        }
        
        .controls {
            width: 100%;
            max-width: 600px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(0, 247, 255, 0.3);
            box-shadow: 0 0 10px rgba(0, 247, 255, 0.2);
        }
        
        .slider-container {
            margin: 12px 0;
        }
        
        label {
            display: inline-block;
            width: 180px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: #00f7ff;
        }
        
        input[type="range"] {
            width: 200px;
            -webkit-appearance: none;
            height: 5px;
            background: rgba(0, 247, 255, 0.2);
            border-radius: 5px;
            outline: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #00f7ff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px #00f7ff;
        }
        
        .value-display {
            display: inline-block;
            width: 50px;
            text-align: right;
            font-family: 'Orbitron', sans-serif;
            color: #00f7ff;
        }
        
        .instructions {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: #00f7ff;
            text-align: center;
            margin: 10px 0;
        }
        
        .particle {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <h1>✧ SPACE IMPACT: GALACTIC STRIKE ✧</h1>
    
    <div class="game-ui">
        <div class="score-health">
            <div class="score">SCORE: <span id="score">0</span></div>
            <div class="health">HEALTH: <span id="health">100</span></div>
        </div>
    </div>
    
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    
    <div class="controls">
        <div class="slider-container">
            <label for="spawnRate">ENEMY SPAWN RATE (ms):</label>
            <input type="range" id="spawnRate" min="500" max="3000" value="2000" class="slider">
            <span class="value-display" id="spawnRateValue">2000</span>
        </div>
        <div class="slider-container">
            <label for="projectileSpeed">PROJECTILE SPEED:</label>
            <input type="range" id="projectileSpeed" min="5" max="20" value="10" class="slider">
            <span class="value-display" id="projectileSpeedValue">10</span>
        </div>
        <div class="slider-container">
            <label for="playerHealth">PLAYER HEALTH:</label>
            <input type="range" id="playerHealth" min="20" max="200" value="100" class="slider">
            <span class="value-display" id="playerHealthValue">100</span>
        </div>
    </div>
    
    <p class="instructions">↑ USE <strong>W/S</strong> OR <strong>↑/↓</strong> TO MOVE · PRESS <strong>SPACE</strong> TO FIRE ↑</p>

    <script>
        // Game state
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Stars for background
        const stars = [];
        for (let i = 0; i < 150; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 0.5 + 0.1,
                opacity: Math.random() * 0.8 + 0.2
            });
        }
        
        // Player
        const player = {
            x: 30,
            y: canvas.height / 2,
            width: 40,
            height: 40,
            speed: 5,
            color: '#00FF00',
            glowColor: 'rgba(0, 255, 0, 0.5)',
            isHit: false,
            hitTimer: 0
        };
        
        // Projectiles
        let projectiles = [];
        const projectileWidth = 10;
        const projectileHeight = 5;
        let projectileSpeed = 10;
        let lastProjectileTime = 0;
        
        // Enemies
        let enemies = [];
        const enemyWidth = 30;
        const enemyHeight = 30;
        let enemySpawnRate = 2000;
        let lastEnemySpawn = 0;
        
        // Particles for explosions
        let particles = [];
        
        // Game stats
        let score = 0;
        let health = 100;
        let screenShake = 0;
        let shakeIntensity = 0;
        
        // Sound effects (using Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playShootSound() {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            gainNode.gain.value = 0.1;
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
        }
        
        function playExplosionSound() {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.frequency.setValueAtTime(200, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
            oscillator.type = 'sawtooth';
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3);
        }
        
        function playHitSound() {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.frequency.value = 400;
            oscillator.type = 'sawtooth';
            gainNode.gain.value = 0.15;
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.2);
        }
        
        // Sliders
        const spawnRateSlider = document.getElementById('spawnRate');
        const projectileSpeedSlider = document.getElementById('projectileSpeed');
        const playerHealthSlider = document.getElementById('playerHealth');
        
        const spawnRateValue = document.getElementById('spawnRateValue');
        const projectileSpeedValue = document.getElementById('projectileSpeedValue');
        const playerHealthValue = document.getElementById('playerHealthValue');
        
        // Update slider values
        spawnRateSlider.addEventListener('input', () => {
            enemySpawnRate = parseInt(spawnRateSlider.value);
            spawnRateValue.textContent = enemySpawnRate;
        });
        
        projectileSpeedSlider.addEventListener('input', () => {
            projectileSpeed = parseInt(projectileSpeedSlider.value);
            projectileSpeedValue.textContent = projectileSpeed;
        });
        
        playerHealthSlider.addEventListener('input', () => {
            health = parseInt(playerHealthSlider.value);
            playerHealthValue.textContent = health;
            document.getElementById('health').textContent = health;
        });
        
        // Keyboard input
        const keys = {
            w: false,
            s: false,
            ArrowUp: false,
            ArrowDown: false,
            Space: false
        };
        
        document.addEventListener('keydown', (e) => {
            if (e.code in keys) {
                keys[e.code] = true;
            }
        });
        
        document.addEventListener('keyup', (e) => {
            if (e.code in keys) {
                keys[e.code] = false;
            }
        });
        
        // Particle system
        function createExplosion(x, y) {
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: x,
                    y: y,
                    size: Math.random() * 3 + 1,
                    speedX: (Math.random() - 0.5) * 5,
                    speedY: (Math.random() - 0.5) * 5,
                    life: 30,
                    color: `hsl(${Math.random() * 60 + 20}, 100%, 50%)`
                });
            }
        }
        
        // Game loop
        function gameLoop(timestamp) {
            // Apply screen shake
            ctx.save();
            if (screenShake > 0) {
                const shakeX = (Math.random() - 0.5) * shakeIntensity * screenShake;
                const shakeY = (Math.random() - 0.5) * shakeIntensity * screenShake;
                ctx.translate(shakeX, shakeY);
                screenShake -= 0.02;
            }
            
            // Clear canvas with starfield
            ctx.fillStyle = 'rgba(10, 14, 42, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw stars
            stars.forEach(star => {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Move star
                star.x -= star.speed;
                if (star.x < 0) {
                    star.x = canvas.width;
                    star.y = Math.random() * canvas.height;
                }
            });
            
            // Move player
            if (keys.w || keys.ArrowUp) {
                player.y -= player.speed;
            }
            if (keys.s || keys.ArrowDown) {
                player.y += player.speed;
            }
            
            // Clamp player position
            player.y = Math.max(player.height / 2, Math.min(canvas.height - player.height / 2, player.y));
            
            // Fire projectile
            if (keys.Space && timestamp - lastProjectileTime > 200) {
                projectiles.push({
                    x: player.x + player.width,
                    y: player.y,
                    width: projectileWidth,
                    height: projectileHeight,
                    age: 0
                });
                lastProjectileTime = timestamp;
                playShootSound();
            }
            
            // Draw player with glow effect
            if (player.isHit) {
                player.hitTimer--;
                if (player.hitTimer <= 0) {
                    player.isHit = false;
                }
                ctx.fillStyle = player.isHit ? '#FF0000' : player.color;
            } else {
                ctx.fillStyle = player.color;
            }
            
            // Player glow
            const gradient = ctx.createRadialGradient(
                player.x + player.width / 2, player.y,
                5, player.x + player.width / 2, player.y, 20
            );
            gradient.addColorStop(0, player.glowColor);
            gradient.addColorStop(1, 'rgba(0, 255, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(
                player.x - 5, player.y - player.height / 2 - 5,
                player.width + 10, player.height + 10
            );
            
            // Draw player ship (triangle shape)
            ctx.fillStyle = player.isHit ? '#FF4444' : '#00FF00';
            ctx.beginPath();
            ctx.moveTo(player.x + player.width, player.y);
            ctx.lineTo(player.x, player.y - player.height / 2);
            ctx.lineTo(player.x, player.y + player.height / 2);
            ctx.closePath();
            ctx.fill();
            
            // Draw engine glow
            ctx.fillStyle = 'rgba(0, 255, 0, 0.3)';
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - player.height / 2 + 5);
            ctx.lineTo(player.x - 10, player.y);
            ctx.lineTo(player.x, player.y + player.height / 2 - 5);
            ctx.closePath();
            ctx.fill();
            
            // Update and draw projectiles with trail
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.x += projectileSpeed;
                p.age++;
                
                // Draw projectile with trail
                ctx.fillStyle = `rgba(255, 255, 0, ${Math.min(1, p.age / 10)})`;
                ctx.fillRect(p.x, p.y - p.height / 2, p.width, p.height);
                
                // Draw trail
                for (let j = 1; j < 5; j++) {
                    ctx.fillStyle = `rgba(255, 255, 0, ${1 - j * 0.2})`;
                    ctx.fillRect(p.x - j * 3, p.y - p.height / 2 + j * 0.5, p.width - j, p.height - j);
                }
                
                // Remove if out of bounds
                if (p.x > canvas.width) {
                    projectiles.splice(i, 1);
                }
            }
            
            // Spawn enemies
            if (timestamp - lastEnemySpawn > enemySpawnRate) {
                const enemyType = Math.random() > 0.7 ? 'big' : 'small';
                enemies.push({
                    x: canvas.width + (enemyType === 'big' ? enemyWidth * 1.5 : enemyWidth),
                    y: Math.random() * (canvas.height - (enemyType === 'big' ? enemyHeight * 1.5 : enemyHeight)),
                    width: enemyType === 'big' ? enemyWidth * 1.5 : enemyWidth,
                    height: enemyType === 'big' ? enemyHeight * 1.5 : enemyHeight,
                    type: enemyType,
                    color: enemyType === 'big' ? '#FF6600' : '#FF0000'
                });
                lastEnemySpawn = timestamp;
            }
            
            // Update and draw enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.x -= e.type === 'big' ? 2 : 3;
                
                // Draw enemy with glow
                const enemyGradient = ctx.createRadialGradient(
                    e.x + e.width / 2, e.y + e.height / 2,
                    5, e.x + e.width / 2, e.y + e.height / 2, e.width / 2
                );
                enemyGradient.addColorStop(0, e.color);
                enemyGradient.addColorStop(1, 'rgba(255, 0, 0, 0)');
                ctx.fillStyle = enemyGradient;
                ctx.fillRect(e.x - 5, e.y - 5, e.width + 10, e.height + 10);
                
                // Draw enemy ship
                ctx.fillStyle = e.color;
                ctx.beginPath();
                ctx.rect(e.x, e.y, e.width, e.height);
                ctx.fill();
                
                // Draw enemy details
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(e.x + e.width / 4, e.y + e.height / 4, e.width / 4, e.height / 4);
                ctx.fillRect(e.x + e.width / 4, e.y + e.height / 2, e.width / 4, e.height / 4);
                
                // Remove if out of bounds
                if (e.x + e.width < 0) {
                    enemies.splice(i, 1);
                }
                
                // Collision with player
                if (
                    player.x < e.x + e.width &&
                    player.x + player.width > e.x &&
                    player.y - player.height / 2 < e.y + e.height &&
                    player.y + player.height / 2 > e.y
                ) {
                    enemies.splice(i, 1);
                    health -= e.type === 'big' ? 20 : 10;
                    document.getElementById('health').textContent = health;
                    playerHealthSlider.value = health;
                    playerHealthValue.textContent = health;
                    player.isHit = true;
                    player.hitTimer = 30;
                    screenShake = 1;
                    shakeIntensity = 10;
                    playHitSound();
                    createExplosion(e.x + e.width / 2, e.y + e.height / 2);
                    if (health <= 0) {
                        setTimeout(() => {
                            alert('GAME OVER! Final Score: ' + score);
                            resetGame();
                        }, 100);
                    }
                }
                
                // Collision with projectiles
                for (let j = projectiles.length - 1; j >= 0; j--) {
                    const p = projectiles[j];
                    if (
                        p.x < e.x + e.width &&
                        p.x + p.width > e.x &&
                        p.y - p.height / 2 < e.y + e.height &&
                        p.y + p.height / 2 > e.y
                    ) {
                        enemies.splice(i, 1);
                        projectiles.splice(j, 1);
                        score += e.type === 'big' ? 30 : 10;
                        document.getElementById('score').textContent = score;
                        playExplosionSound();
                        screenShake = 0.5;
                        shakeIntensity = 5;
                        createExplosion(e.x + e.width / 2, e.y + e.height / 2);
                        break;
                    }
                }
            }
            
            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.speedX;
                p.y += p.speedY;
                p.life--;
                
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
            
            // Draw health bar with style
            ctx.fillStyle = '#333';
            ctx.fillRect(20, 20, 204, 24);
            const healthGradient = ctx.createLinearGradient(20, 20, 224, 20);
            healthGradient.addColorStop(0, '#00FF00');
            healthGradient.addColorStop(0.5, '#00CC00');
            healthGradient.addColorStop(1, '#006600');
            ctx.fillStyle = healthGradient;
            ctx.fillRect(20, 20, 2 * health, 24);
            ctx.strokeStyle = '#00FF00';
            ctx.lineWidth = 2;
            ctx.strokeRect(20, 20, 204, 24);
            
            // Draw score with glow
            ctx.font = 'bold 20px Orbitron';
            ctx.fillStyle = '#00f7ff';
            ctx.textAlign = 'left';
            ctx.fillText('SCORE: ' + score, canvas.width - 150, 35);
            ctx.strokeStyle = 'rgba(0, 247, 255, 0.5)';
            ctx.lineWidth = 2;
            ctx.strokeText('SCORE: ' + score, canvas.width - 150, 35);
            
            ctx.restore();
            requestAnimationFrame(gameLoop);
        }
        
        function resetGame() {
            projectiles = [];
            enemies = [];
            particles = [];
            score = 0;
            health = parseInt(playerHealthSlider.value);
            document.getElementById('score').textContent = score;
            document.getElementById('health').textContent = health;
            playerHealthValue.textContent = health;
            player.isHit = false;
            screenShake = 0;
        }
        
        // Start game
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
