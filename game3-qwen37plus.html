<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Space Shooter - Boss Battles</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2a 100%);
    color: #fff;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    min-height: 100vh;
    overflow-x: hidden;
  }
  h1 {
    margin-bottom: 10px;
    color: #0ff;
    text-shadow: 0 0 15px #0ff, 0 0 30px #0ff;
    letter-spacing: 5px;
    font-size: 32px;
    animation: titlePulse 2s ease-in-out infinite;
  }
  @keyframes titlePulse {
    0%, 100% { text-shadow: 0 0 15px #0ff, 0 0 30px #0ff; }
    50% { text-shadow: 0 0 20px #0ff, 0 0 40px #0ff, 0 0 60px #0ff; }
  }
  #game {
    border: 3px solid #0ff;
    box-shadow: 0 0 30px #0ff, inset 0 0 30px rgba(0, 255, 255, 0.1);
    background: #000;
    display: block;
    border-radius: 8px;
  }
  #hud {
    width: 800px;
    margin-top: 12px;
    display: flex;
    justify-content: space-between;
    font-size: 18px;
    font-weight: bold;
    gap: 20px;
  }
  #hud > div {
    display: flex;
    gap: 15px;
  }
  #hud span { 
    color: #0ff; 
    text-shadow: 0 0 10px #0ff;
  }
  #powerups {
    width: 800px;
    margin-top: 8px;
    display: flex;
    gap: 10px;
    min-height: 30px;
  }
  .powerup-indicator {
    padding: 4px 12px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: bold;
    animation: powerupPulse 1s ease-in-out infinite;
  }
  @keyframes powerupPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  #controls {
    width: 800px;
    margin-top: 14px;
    background: linear-gradient(135deg, rgba(20, 20, 40, 0.9), rgba(30, 20, 50, 0.9));
    border: 2px solid #0ff;
    border-radius: 8px;
    padding: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
  }
  .ctrl {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .ctrl label {
    font-size: 13px;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .ctrl input[type=range] {
    width: 100%;
    accent-color: #0ff;
    height: 6px;
    border-radius: 3px;
  }
  .ctrl .val {
    font-size: 16px;
    color: #0ff;
    text-align: right;
    text-shadow: 0 0 8px #0ff;
    font-weight: bold;
  }
  #msg {
    margin-top: 12px;
    height: 24px;
    color: #f55;
    font-weight: bold;
    font-size: 18px;
    text-shadow: 0 0 10px #f55;
    animation: msgPulse 1s ease-in-out infinite;
  }
  @keyframes msgPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }
  .hint {
    margin-top: 10px;
    color: #666;
    font-size: 13px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <h1>⚡ SPACE SHOOTER ⚡</h1>
  <canvas id="game" width="800" height="500"></canvas>
  <div id="hud">
    <div>
      <div>SCORE: <span id="score">0</span></div>
      <div>HIGH: <span id="highScore">0</span></div>
    </div>
    <div>
      <div>COMBO: <span id="combo">x1</span></div>
      <div>HEALTH: <span id="health">100</span></div>
    </div>
  </div>
  <div id="powerups"></div>
  <div id="msg"></div>
  <div id="controls">
    <div class="ctrl">
      <label>Enemy Spawn Rate</label>
      <input type="range" id="spawnRate" min="200" max="2000" step="50" value="800">
      <div class="val" id="spawnRateVal">800 ms</div>
    </div>
    <div class="ctrl">
      <label>Projectile Speed</label>
      <input type="range" id="projSpeed" min="3" max="20" step="1" value="8">
      <div class="val" id="projSpeedVal">8</div>
    </div>
    <div class="ctrl">
      <label>Player Max Health</label>
      <input type="range" id="maxHealth" min="20" max="200" step="10" value="100">
      <div class="val" id="maxHealthVal">100</div>
    </div>
  </div>
  <div class="hint">↑ / ↓ to move • SPACE to fire • R to restart</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const scoreEl = document.getElementById('score');
  const highScoreEl = document.getElementById('highScore');
  const healthEl = document.getElementById('health');
  const comboEl = document.getElementById('combo');
  const msgEl = document.getElementById('msg');
  const powerupsEl = document.getElementById('powerups');

  const spawnRateSlider = document.getElementById('spawnRate');
  const projSpeedSlider = document.getElementById('projSpeed');
  const maxHealthSlider = document.getElementById('maxHealth');
  const spawnRateVal = document.getElementById('spawnRateVal');
  const projSpeedVal = document.getElementById('projSpeedVal');
  const maxHealthVal = document.getElementById('maxHealthVal');

  spawnRateSlider.oninput = () => spawnRateVal.textContent = spawnRateSlider.value + ' ms';
  projSpeedSlider.oninput = () => projSpeedVal.textContent = projSpeedSlider.value;
  maxHealthSlider.oninput = () => {
    maxHealthVal.textContent = maxHealthSlider.value;
    if (player.health > maxHealth) player.health = maxHealth;
  };

  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === ' ') e.preventDefault();
    if (e.key === 'r' || e.key === 'R') resetGame();
  });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  let audioCtx;
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function playSound(freq, duration, type = 'sine', volume = 0.1) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value = freq;
    osc.type = type;
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + duration);
  }

  function shootSound() { playSound(800, 0.1, 'square', 0.05); }
  function explosionSound() {
    playSound(150, 0.3, 'sawtooth', 0.15);
    setTimeout(() => playSound(80, 0.2, 'sawtooth', 0.1), 50);
  }
  function hitSound() { playSound(200, 0.15, 'square', 0.1); }
  function powerupSound() {
    playSound(600, 0.1, 'sine', 0.1);
    setTimeout(() => playSound(900, 0.1, 'sine', 0.1), 100);
  }
  function bossSound() {
    playSound(100, 0.5, 'sawtooth', 0.2);
  }

  let player, projectiles, enemies, enemyProjectiles, stars, particles, floatingTexts, powerups, boss;
  let score, highScore, combo, comboTimer, lastSpawn, lastShot, gameOver, screenShake, shakeIntensity;
  let bossSpawnTimer, nextBossScore, activePowerups;

  const POWERUP_TYPES = {
    HEALTH: { color: '#0f0', icon: '❤', name: 'HEALTH', duration: 0 },
    RAPID: { color: '#ff0', icon: '⚡', name: 'RAPID FIRE', duration: 10000 },
    SHIELD: { color: '#0ff', icon: '🛡', name: 'SHIELD', duration: 8000 },
    MULTI: { color: '#f0f', icon: '✦', name: 'MULTI-SHOT', duration: 12000 },
    SPEED: { color: '#f80', icon: '»', name: 'SPEED BOOST', duration: 10000 }
  };

  function createStars() {
    const arr = [];
    for (let i = 0; i < 100; i++) {
      arr.push({
        x: Math.random() * W,
        y: Math.random() * H,
        s: Math.random() * 2 + 0.5,
        v: Math.random() * 2 + 0.5,
        brightness: Math.random()
      });
    }
    return arr;
  }

  function createParticles(x, y, color, count = 15) {
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
      const speed = Math.random() * 4 + 2;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: Math.random() * 0.02 + 0.02,
        size: Math.random() * 3 + 2,
        color
      });
    }
  }

  function createFloatingText(x, y, text, color = '#ff0', size = 16) {
    floatingTexts.push({
      x, y,
      text,
      color,
      life: 1,
      vy: -2,
      size
    });
  }

  function spawnPowerup(x, y) {
    if (Math.random() > 0.3) return; // 30% chance
    
    const types = Object.keys(POWERUP_TYPES);
    const type = types[Math.floor(Math.random() * types.length)];
    const info = POWERUP_TYPES[type];
    
    powerups.push({
      x, y,
      w: 20,
      h: 20,
      type,
      info,
      vx: -1,
      pulse: 0
    });
  }

  function activatePowerup(type) {
    const info = POWERUP_TYPES[type];
    powerupSound();
    
    if (type === 'HEALTH') {
      player.health = Math.min(parseInt(maxHealthSlider.value), player.health + 30);
      createFloatingText(player.x, player.y - 20, '+30 HP', '#0f0', 18);
    } else {
      activePowerups[type] = {
        info,
        endTime: performance.now() + info.duration
      };
      createFloatingText(player.x, player.y - 20, info.name, info.color, 18);
    }
    
    updatePowerupUI();
  }

  function updatePowerupUI() {
    powerupsEl.innerHTML = '';
    const now = performance.now();
    
    for (const [type, data] of Object.entries(activePowerups)) {
      if (data.endTime > now) {
        const remaining = Math.ceil((data.endTime - now) / 1000);
        const div = document.createElement('div');
        div.className = 'powerup-indicator';
        div.style.background = data.info.color;
        div.style.color = '#000';
        div.textContent = `${data.info.icon} ${data.info.name} ${remaining}s`;
        powerupsEl.appendChild(div);
      } else {
        delete activePowerups[type];
      }
    }
  }

  function hasPowerup(type) {
    return activePowerups[type] && activePowerups[type].endTime > performance.now();
  }

  function resetGame() {
    initAudio();
    player = {
      x: 40,
      y: H / 2 - 15,
      w: 40,
      h: 26,
      speed: 5,
      health: parseInt(maxHealthSlider.value),
      invuln: 0,
      thrust: 0
    };
    projectiles = [];
    enemyProjectiles = [];
    enemies = [];
    particles = [];
    floatingTexts = [];
    powerups = [];
    boss = null;
    stars = createStars();
    score = 0;
    highScore = parseInt(localStorage.getItem('spaceShooterHighScore') || '0');
    combo = 1;
    comboTimer = 0;
    lastSpawn = 0;
    lastShot = 0;
    gameOver = false;
    screenShake = 0;
    shakeIntensity = 0;
    bossSpawnTimer = 0;
    nextBossScore = 500;
    activePowerups = {};
    msgEl.textContent = '';
    updatePowerupUI();
  }

  function spawnEnemy(now) {
    const size = 24 + Math.random() * 16;
    const types = [
      { color: '#f0f', hue: 300 },
      { color: '#f50', hue: 20 },
      { color: '#0f0', hue: 120 }
    ];
    const type = types[Math.floor(Math.random() * types.length)];
    enemies.push({
      x: W + 10,
      y: Math.random() * (H - size),
      w: size,
      h: size * 0.7,
      vx: -(2 + Math.random() * 2),
      color: type.color,
      hue: type.hue,
      pulse: Math.random() * Math.PI * 2
    });
  }

  function spawnBoss() {
    bossSound();
    boss = {
      x: W + 50,
      y: H / 2 - 60,
      w: 120,
      h: 120,
      health: 100,
      maxHealth: 100,
      vx: -2,
      phase: 0,
      attackTimer: 0,
      moveTimer: 0,
      pulse: 0
    };
    createFloatingText(W / 2, H / 2, '⚠ BOSS INCOMING ⚠', '#f00', 24);
  }

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function update(now, dt) {
    if (gameOver) return;

    if (screenShake > 0) screenShake -= dt;
    if (comboTimer > 0) {
      comboTimer -= dt;
      if (comboTimer <= 0) combo = 1;
    }

    // Player movement
    const speedBoost = hasPowerup('SPEED') ? 1.5 : 1;
    if (keys['ArrowUp'] || keys['w'] || keys['W']) {
      player.y -= player.speed * speedBoost;
      player.thrust = Math.min(1, player.thrust + 0.1);
    } else if (keys['ArrowDown'] || keys['s'] || keys['S']) {
      player.y += player.speed * speedBoost;
      player.thrust = Math.min(1, player.thrust + 0.1);
    } else {
      player.thrust = Math.max(0, player.thrust - 0.05);
    }
    player.y = Math.max(0, Math.min(H - player.h, player.y));
    if (player.invuln > 0) player.invuln -= dt;

    // Thrust particles
    if (player.thrust > 0.3 && Math.random() < player.thrust) {
      particles.push({
        x: player.x - 5,
        y: player.y + player.h / 2 + (Math.random() - 0.5) * 6,
        vx: -Math.random() * 3 - 2,
        vy: (Math.random() - 0.5) * 2,
        life: 1,
        decay: 0.05,
        size: Math.random() * 3 + 2,
        color: '#ff0'
      });
    }

    // Shooting
    const shootCooldown = hasPowerup('RAPID') ? 80 : 180;
    if (keys[' '] && now - lastShot > shootCooldown) {
      const multiShot = hasPowerup('MULTI');
      const shots = multiShot ? 3 : 1;
      
      for (let i = 0; i < shots; i++) {
        const offsetY = multiShot ? (i - 1) * 8 : 0;
        projectiles.push({
          x: player.x + player.w,
          y: player.y + player.h / 2 - 2 + offsetY,
          w: 12,
          h: 4,
          trail: []
        });
      }
      lastShot = now;
      shootSound();
      createParticles(player.x + player.w, player.y + player.h / 2, '#ff0', 5);
    }

    // Projectiles
    const pspeed = parseInt(projSpeedSlider.value);
    for (let i = projectiles.length - 1; i >= 0; i--) {
      const p = projectiles[i];
      p.trail.push({ x: p.x, y: p.y });
      if (p.trail.length > 5) p.trail.shift();
      p.x += pspeed;
      if (p.x > W) projectiles.splice(i, 1);
    }

    // Enemy projectiles
    for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
      const p = enemyProjectiles[i];
      p.x += p.vx;
      p.y += p.vy;
      
      if (p.x < 0 || p.x > W || p.y < 0 || p.y > H) {
        enemyProjectiles.splice(i, 1);
        continue;
      }

      // Hit player
      if (player.invuln <= 0 && !hasPowerup('SHIELD') && rectsOverlap(player, p)) {
        enemyProjectiles.splice(i, 1);
        player.health -= 10;
        player.invuln = 400;
        screenShake = 200;
        shakeIntensity = 5;
        hitSound();
        createParticles(player.x + player.w / 2, player.y + player.h / 2, '#f00', 10);
        
        if (player.health <= 0) {
          player.health = 0;
          gameOver = true;
          msgEl.textContent = '💀 GAME OVER - Press R to restart 💀';
          createParticles(player.x + player.w / 2, player.y + player.h / 2, '#0ff', 40);
          if (score > highScore) {
            highScore = score;
            localStorage.setItem('spaceShooterHighScore', highScore.toString());
          }
        }
      }
    }

    // Enemy spawn
    const spawnRate = parseInt(spawnRateSlider.value);
    if (now - lastSpawn > spawnRate && !boss) {
      spawnEnemy(now);
      lastSpawn = now;
    }

    // Boss spawn
    if (score >= nextBossScore && !boss) {
      spawnBoss();
      nextBossScore += 500;
    }

    // Enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.x += e.vx;
      e.pulse += 0.1;
      if (e.x + e.w < 0) {
        enemies.splice(i, 1);
        continue;
      }

      let hit = false;
      for (let j = projectiles.length - 1; j >= 0; j--) {
        if (rectsOverlap(projectiles[j], e)) {
          projectiles.splice(j, 1);
          hit = true;
          break;
        }
      }
      if (hit) {
        createParticles(e.x + e.w / 2, e.y + e.h / 2, e.color, 20);
        const points = 10 * combo;
        createFloatingText(e.x, e.y, `+${points}`, '#ff0');
        explosionSound();
        spawnPowerup(e.x, e.y);
        enemies.splice(i, 1);
        score += points;
        combo = Math.min(10, combo + 1);
        comboTimer = 3000;
        continue;
      }

      if (player.invuln <= 0 && !hasPowerup('SHIELD') && rectsOverlap(player, e)) {
        createParticles(player.x + player.w / 2, player.y + player.h / 2, '#f00', 25);
        enemies.splice(i, 1);
        player.health -= 20;
        player.invuln = 600;
        screenShake = 300;
        shakeIntensity = 8;
        hitSound();
        
        if (player.health <= 0) {
          player.health = 0;
          gameOver = true;
          msgEl.textContent = '💀 GAME OVER - Press R to restart 💀';
          createParticles(player.x + player.w / 2, player.y + player.h / 2, '#0ff', 40);
          if (score > highScore) {
            highScore = score;
            localStorage.setItem('spaceShooterHighScore', highScore.toString());
          }
        }
      }
    }

    // Boss logic
    if (boss) {
      boss.pulse += 0.1;
      
      // Move into position
      if (boss.x > W - 150) {
        boss.x += boss.vx;
      } else {
        // Movement pattern
        boss.moveTimer += dt;
        boss.y += Math.sin(boss.moveTimer * 0.002) * 2;
        boss.y = Math.max(0, Math.min(H - boss.h, boss.y));
        
        // Attack patterns
        boss.attackTimer += dt;
        if (boss.attackTimer > 1500) {
          boss.attackTimer = 0;
          boss.phase = (boss.phase + 1) % 3;
          
          if (boss.phase === 0) {
            // Spread shot
            for (let i = -2; i <= 2; i++) {
              enemyProjectiles.push({
                x: boss.x,
                y: boss.y + boss.h / 2,
                w: 8,
                h: 8,
                vx: -5,
                vy: i * 1.5,
                color: '#f00'
              });
            }
          } else if (boss.phase === 1) {
            // Aimed shot
            const dx = player.x - boss.x;
            const dy = player.y - boss.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            enemyProjectiles.push({
              x: boss.x,
              y: boss.y + boss.h / 2,
              w: 10,
              h: 10,
              vx: (dx / dist) * 6,
              vy: (dy / dist) * 6,
              color: '#ff0'
            });
          } else {
            // Circle shot
            for (let i = 0; i < 8; i++) {
              const angle = (Math.PI * 2 * i) / 8;
              enemyProjectiles.push({
                x: boss.x + boss.w / 2,
                y: boss.y + boss.h / 2,
                w: 6,
                h: 6,
                vx: Math.cos(angle) * 4,
                vy: Math.sin(angle) * 4,
                color: '#f0f'
              });
            }
          }
        }
      }

      // Boss hit detection
      for (let j = projectiles.length - 1; j >= 0; j--) {
        if (rectsOverlap(projectiles[j], boss)) {
          projectiles.splice(j, 1);
          boss.health -= 2;
          createParticles(boss.x + boss.w / 2, boss.y + boss.h / 2, '#ff0', 5);
          
          if (boss.health <= 0) {
            createParticles(boss.x + boss.w / 2, boss.y + boss.h / 2, '#f00', 50);
            createFloatingText(boss.x, boss.y, '+500', '#ff0', 24);
            explosionSound();
            score += 500 * combo;
            combo = Math.min(10, combo + 3);
            comboTimer = 5000;
            spawnPowerup(boss.x, boss.y);
            boss = null;
            screenShake = 500;
            shakeIntensity = 12;
            break;
          }
        }
      }
    }

    // Powerups
    for (let i = powerups.length - 1; i >= 0; i--) {
      const p = powerups[i];
      p.x += p.vx;
      p.pulse += 0.1;
      
      if (p.x + p.w < 0) {
        powerups.splice(i, 1);
        continue;
      }

      if (rectsOverlap(player, p)) {
        activatePowerup(p.type);
        createParticles(p.x + p.w / 2, p.y + p.h / 2, p.info.color, 15);
        powerups.splice(i, 1);
      }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.98;
      p.vy *= 0.98;
      p.life -= p.decay;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Floating texts
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const t = floatingTexts[i];
      t.y += t.vy;
      t.life -= 0.02;
      if (t.life <= 0) floatingTexts.splice(i, 1);
    }

    // Stars
    for (const s of stars) {
      s.x -= s.v;
      s.brightness = 0.5 + Math.sin(now * 0.001 + s.x) * 0.3;
      if (s.x < 0) { s.x = W; s.y = Math.random() * H; }
    }

    updatePowerupUI();
  }

  function drawPlayer() {
    ctx.save();
    
    if (screenShake > 0) {
      const shakeX = (Math.random() - 0.5) * shakeIntensity;
      const shakeY = (Math.random() - 0.5) * shakeIntensity;
      ctx.translate(shakeX, shakeY);
    }
    
    const flicker = player.invuln > 0 && Math.floor(performance.now() / 80) % 2 === 0;
    if (flicker) ctx.globalAlpha = 0.4;

    // Shield effect
    if (hasPowerup('SHIELD')) {
      ctx.strokeStyle = '#0ff';
      ctx.lineWidth = 3;
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#0ff';
      ctx.beginPath();
      ctx.arc(player.x + player.w / 2, player.y + player.h / 2, 30, 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    ctx.shadowBlur = 15;
    ctx.shadowColor = '#0ff';

    const gradient = ctx.createLinearGradient(player.x, player.y, player.x + player.w, player.y);
    gradient.addColorStop(0, '#0aa');
    gradient.addColorStop(0.5, '#0ff');
    gradient.addColorStop(1, '#0aa');
    ctx.fillStyle = gradient;
    
    ctx.beginPath();
    ctx.moveTo(player.x, player.y + player.h / 2);
    ctx.lineTo(player.x + 10, player.y);
    ctx.lineTo(player.x + player.w, player.y + player.h / 2);
    ctx.lineTo(player.x + 10, player.y + player.h);
    ctx.closePath();
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.fillRect(player.x + 18, player.y + player.h / 2 - 3, 8, 6);

    if (player.thrust > 0) {
      ctx.fillStyle = `rgba(255, 255, 0, ${player.thrust})`;
      ctx.fillRect(player.x - 8, player.y + player.h / 2 - 4, 8, 8);
      ctx.fillStyle = `rgba(255, 150, 0, ${player.thrust * 0.7})`;
      ctx.fillRect(player.x - 12, player.y + player.h / 2 - 3, 4, 6);
    }
    
    ctx.restore();
  }

  function drawEnemy(e) {
    ctx.save();
    ctx.shadowBlur = 10;
    ctx.shadowColor = e.color;
    
    const pulse = Math.sin(e.pulse) * 0.2 + 0.8;
    ctx.globalAlpha = pulse;
    
    const gradient = ctx.createRadialGradient(
      e.x + e.w / 2, e.y + e.h / 2, 0,
      e.x + e.w / 2, e.y + e.h / 2, e.w / 2
    );
    gradient.addColorStop(0, '#fff');
    gradient.addColorStop(0.5, e.color);
    gradient.addColorStop(1, `hsl(${e.hue}, 80%, 30%)`);
    
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.moveTo(e.x + e.w, e.y + e.h / 2);
    ctx.lineTo(e.x + e.w - 8, e.y);
    ctx.lineTo(e.x, e.y + e.h / 2);
    ctx.lineTo(e.x + e.w - 8, e.y + e.h);
    ctx.closePath();
    ctx.fill();
    
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.fillRect(e.x + e.w - 12, e.y + e.h / 2 - 2, 5, 4);
    
    ctx.restore();
  }

  function drawBoss() {
    if (!boss) return;
    
    ctx.save();
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#f00';
    
    const pulse = Math.sin(boss.pulse) * 0.1 + 0.9;
    ctx.globalAlpha = pulse;
    
    // Boss body
    const gradient = ctx.createRadialGradient(
      boss.x + boss.w / 2, boss.y + boss.h / 2, 0,
      boss.x + boss.w / 2, boss.y + boss.h / 2, boss.w / 2
    );
    gradient.addColorStop(0, '#fff');
    gradient.addColorStop(0.3, '#f00');
    gradient.addColorStop(1, '#800');
    
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.moveTo(boss.x + boss.w, boss.y + boss.h / 2);
    ctx.lineTo(boss.x + boss.w - 20, boss.y);
    ctx.lineTo(boss.x, boss.y + boss.h / 2);
    ctx.lineTo(boss.x + boss.w - 20, boss.y + boss.h);
    ctx.closePath();
    ctx.fill();
    
    // Boss eye
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ff0';
    ctx.beginPath();
    ctx.arc(boss.x + boss.w - 30, boss.y + boss.h / 2, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(boss.x + boss.w - 30, boss.y + boss.h / 2, 5, 0, Math.PI * 2);
    ctx.fill();
    
    // Health bar
    const barWidth = boss.w;
    const barHeight = 8;
    const barX = boss.x;
    const barY = boss.y - 15;
    
    ctx.fillStyle = '#222';
    ctx.fillRect(barX, barY, barWidth, barHeight);
    
    const healthPct = boss.health / boss.maxHealth;
    ctx.fillStyle = healthPct > 0.5 ? '#0f0' : healthPct > 0.25 ? '#ff0' : '#f00';
    ctx.fillRect(barX, barY, barWidth * healthPct, barHeight);
    
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(barX, barY, barWidth, barHeight);
    
    ctx.restore();
  }

  function drawPowerup(p) {
    ctx.save();
    const pulse = Math.sin(p.pulse) * 0.2 + 0.8;
    ctx.globalAlpha = pulse;
    
    ctx.shadowBlur = 15;
    ctx.shadowColor = p.info.color;
    ctx.fillStyle = p.info.color;
    ctx.fillRect(p.x, p.y, p.w, p.h);
    
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#000';
    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.info.icon, p.x + p.w / 2, p.y + p.h / 2);
    
    ctx.restore();
  }

  function drawHealthBar() {
    const max = parseInt(maxHealthSlider.value);
    const pct = player.health / max;
    const bw = 200, bh = 16;
    const bx = W - bw - 10, by = 10;
    
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
    
    ctx.fillStyle = '#222';
    ctx.fillRect(bx, by, bw, bh);
    
    const color = pct > 0.5 ? '#0f0' : pct > 0.25 ? '#ff0' : '#f00';
    const gradient = ctx.createLinearGradient(bx, by, bx, by + bh);
    gradient.addColorStop(0, color);
    gradient.addColorStop(0.5, '#fff');
    gradient.addColorStop(1, color);
    ctx.fillStyle = gradient;
    ctx.fillRect(bx, by, bw * pct, bh);
    
    ctx.shadowBlur = 10;
    ctx.shadowColor = color;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, bh);
    ctx.shadowBlur = 0;
    
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
    ctx.lineWidth = 1;
    for (let i = 1; i < 10; i++) {
      ctx.beginPath();
      ctx.moveTo(bx + (bw / 10) * i, by);
      ctx.lineTo(bx + (bw / 10) * i, by + bh);
      ctx.stroke();
    }
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px Courier New';
    ctx.fillText('HP', bx - 24, by + 12);
  }

  function render() {
    ctx.save();
    
    const bgGradient = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W);
    bgGradient.addColorStop(0, '#0a0a1a');
    bgGradient.addColorStop(1, '#000');
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, W, H);

    for (const s of stars) {
      ctx.globalAlpha = s.brightness;
      ctx.fillStyle = '#fff';
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;

    for (const p of particles) {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.shadowBlur = 8;
      ctx.shadowColor = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;

    for (const p of projectiles) {
      for (let i = 0; i < p.trail.length; i++) {
        const t = p.trail[i];
        const alpha = i / p.trail.length * 0.5;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#ff0';
        ctx.fillRect(t.x, t.y, p.w * 0.8, p.h * 0.8);
      }
    }
    ctx.globalAlpha = 1;

    ctx.shadowBlur = 10;
    ctx.shadowColor = '#ff0';
    ctx.fillStyle = '#ff0';
    for (const p of projectiles) {
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#fff';
      ctx.fillRect(p.x + p.w - 3, p.y, 3, p.h);
      ctx.fillStyle = '#ff0';
    }
    ctx.shadowBlur = 0;

    // Enemy projectiles
    for (const p of enemyProjectiles) {
      ctx.shadowBlur = 10;
      ctx.shadowColor = p.color;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x + p.w / 2, p.y + p.h / 2, p.w / 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    for (const e of enemies) drawEnemy(e);
    
    drawBoss();
    
    for (const p of powerups) drawPowerup(p);

    if (!gameOver) drawPlayer();

    for (const t of floatingTexts) {
      ctx.globalAlpha = t.life;
      ctx.fillStyle = t.color;
      ctx.font = `bold ${t.size}px Courier New`;
      ctx.shadowBlur = 10;
      ctx.shadowColor = t.color;
      ctx.fillText(t.text, t.x, t.y);
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;

    drawHealthBar();

    ctx.restore();

    scoreEl.textContent = score;
    highScoreEl.textContent = highScore;
    healthEl.textContent = player.health;
    comboEl.textContent = `x${combo}`;
    comboEl.style.color = combo > 1 ? '#ff0' : '#0ff';
  }

  let lastTime = performance.now();
  function loop(now) {
    const dt = now - lastTime;
    lastTime = now;
    update(now, dt);
    render();
    requestAnimationFrame(loop);
  }

  resetGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
