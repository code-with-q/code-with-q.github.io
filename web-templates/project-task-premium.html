<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kanban Pro v2 — by Code With Q</title>
<style>
  :root {
    --primary: #1976D2;
    --primary-dark: #1565C0;
    --primary-light: #BBDEFB;
    --primary-bg: rgba(25, 118, 210, 0.08);
    --accent: #FF5722;
    --success: #388E3C;
    --warning: #F57C00;
    --danger: #D32F2F;
    --critical: #880E4F;
    --bg: #F5F7FB;
    --bg-gradient: linear-gradient(135deg, #F5F7FB 0%, #EAF1FA 100%);
    --surface: #FFFFFF;
    --surface-2: #FAFBFD;
    --text: #263238;
    --text-muted: #607D8B;
    --text-subtle: #90A4AE;
    --border: #E3EAF2;
    --border-strong: #CFD8DC;
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.06);
    --shadow-md: 0 4px 12px rgba(16, 24, 40, 0.08);
    --shadow-lg: 0 10px 30px rgba(16, 24, 40, 0.12);
    --shadow-xl: 0 20px 40px rgba(16, 24, 40, 0.18);
    --radius: 12px;
    --radius-sm: 8px;
    --radius-pill: 100px;
  }

  [data-theme="dark"] {
    --bg: #0F1419;
    --bg-gradient: linear-gradient(135deg, #0F1419 0%, #1A2332 100%);
    --surface: #1C2633;
    --surface-2: #243040;
    --text: #E8EEF5;
    --text-muted: #8FA3B8;
    --text-subtle: #5A6C80;
    --border: #2C3A4D;
    --border-strong: #3A4A60;
    --primary-bg: rgba(25, 118, 210, 0.18);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
    --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.5);
    --shadow-xl: 0 20px 40px rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg-gradient);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    transition: background 0.3s ease, color 0.3s ease;
  }

  .app { display: flex; flex-direction: column; min-height: 100vh; }

  /* ===== HEADER ===== */
  .header {
    background: var(--surface);
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    position: sticky;
    top: 0;
    z-index: 50;
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  .header-inner {
    max-width: 1600px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
    justify-content: space-between;
  }

  .brand { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }

  .brand-logo {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, var(--primary) 0%, #42A5F5 100%);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 12px rgba(25, 118, 210, 0.35);
    position: relative;
    overflow: hidden;
  }

  .brand-logo::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.3) 50%, transparent 60%);
    animation: shimmer 3s infinite;
  }

  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .brand-logo svg { width: 24px; height: 24px; fill: white; z-index: 1; }

  .brand-title {
    font-size: 18px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--primary) 0%, #42A5F5 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .brand-subtitle { font-size: 11px; color: var(--text-muted); font-weight: 500; letter-spacing: 0.02em; }

  /* ===== TOOLBAR ===== */
  .toolbar { display: flex; flex: 1; gap: 10px; align-items: center; justify-content: flex-end; flex-wrap: wrap; min-width: 0; }

  .search-box { position: relative; flex: 0 1 260px; min-width: 160px; }

  .search-box input {
    width: 100%;
    padding: 10px 12px 10px 36px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
    transition: all 0.2s ease;
    font-family: inherit;
  }

  .search-box input:focus {
    outline: none;
    border-color: var(--primary);
    background: var(--surface);
    box-shadow: 0 0 0 4px var(--primary-bg);
  }

  .search-box svg {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    width: 15px;
    height: 15px;
    fill: var(--text-subtle);
    pointer-events: none;
  }

  .icon-btn {
    width: 38px;
    height: 38px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    position: relative;
    flex-shrink: 0;
  }

  .icon-btn svg { width: 16px; height: 16px; fill: currentColor; }
  .icon-btn:hover { background: var(--primary-bg); color: var(--primary); border-color: var(--primary); transform: translateY(-1px); }
  .icon-btn:active { transform: translateY(0); }

  .dropdown { position: relative; }

  .dropdown-menu {
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-lg);
    min-width: 180px;
    padding: 6px;
    z-index: 100;
    opacity: 0;
    transform: translateY(-6px) scale(0.96);
    pointer-events: none;
    transition: all 0.18s ease;
  }

  .dropdown.open .dropdown-menu { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }

  .dropdown-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--text);
    font-size: 13px;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    font-family: inherit;
    transition: background 0.15s ease;
  }

  .dropdown-item:hover { background: var(--primary-bg); color: var(--primary); }
  .dropdown-item.danger:hover { background: #FFEBEE; color: var(--danger); }
  [data-theme="dark"] .dropdown-item.danger:hover { background: rgba(211, 47, 47, 0.15); }
  .dropdown-item svg { width: 14px; height: 14px; fill: currentColor; }
  .dropdown-divider { height: 1px; background: var(--border); margin: 4px 0; }

  /* ===== BOARD TABS ===== */
  .tabs-row {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 28px;
    display: flex;
    align-items: stretch;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: thin;
    transition: background 0.3s ease;
  }

  .tabs-row::-webkit-scrollbar { height: 4px; }
  .tabs-row::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

  .tab {
    padding: 12px 18px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 2px solid transparent;
    transition: all 0.2s ease;
    white-space: nowrap;
    font-family: inherit;
    position: relative;
  }

  .tab:hover { color: var(--text); }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

  .tab-count {
    background: var(--bg);
    color: var(--text-muted);
    padding: 2px 8px;
    border-radius: var(--radius-pill);
    font-size: 11px;
    font-weight: 700;
  }

  .tab.active .tab-count { background: var(--primary-bg); color: var(--primary); }

  .tab-close {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: all 0.15s ease;
    background: transparent;
  }

  .tab:hover .tab-close { opacity: 1; }
  .tab-close:hover { background: var(--border-strong); }
  .tab-close svg { width: 10px; height: 10px; fill: currentColor; }

  .tab-add {
    padding: 12px;
    background: none;
    border: none;
    color: var(--text-subtle);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    transition: all 0.2s ease;
    align-self: center;
  }

  .tab-add:hover { background: var(--primary-bg); color: var(--primary); }
  .tab-add svg { width: 18px; height: 18px; fill: currentColor; }

  /* ===== ADD TASK FORM ===== */
  .add-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
    transition: background 0.3s ease;
  }

  .add-bar-inner {
    max-width: 1600px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  .add-bar input[type="text"] {
    flex: 1;
    min-width: 180px;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
    transition: all 0.2s ease;
    font-family: inherit;
  }

  .add-bar input[type="text"]:focus {
    outline: none;
    border-color: var(--primary);
    background: var(--surface);
    box-shadow: 0 0 0 4px var(--primary-bg);
  }

  .add-bar input[type="date"] {
    padding: 11px 12px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
    transition: all 0.2s ease;
  }

  .add-bar input[type="date"]:focus {
    outline: none;
    border-color: var(--primary);
    background: var(--surface);
    box-shadow: 0 0 0 4px var(--primary-bg);
  }

  .add-bar select {
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .add-bar select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-bg); }

  .btn {
    padding: 11px 20px;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
    position: relative;
    overflow: hidden;
  }

  .btn svg { width: 15px; height: 15px; fill: currentColor; }

  .btn-primary {
    background: linear-gradient(135deg, var(--primary) 0%, #42A5F5 100%);
    color: white;
    box-shadow: 0 2px 8px rgba(25, 118, 210, 0.35);
  }

  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(25, 118, 210, 0.45); }
  .btn-primary:active { transform: translateY(0); }

  .btn-ghost {
    background: transparent;
    color: var(--text-muted);
    border: 1.5px solid var(--border);
  }
  .btn-ghost:hover { background: var(--bg); color: var(--text); border-color: var(--border-strong); }

  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.5);
    transform: scale(0);
    animation: rippleEffect 0.6s ease-out;
    pointer-events: none;
  }

  @keyframes rippleEffect { to { transform: scale(4); opacity: 0; } }

  /* ===== PROGRESS BAR ===== */
  .progress-wrap {
    padding: 0 28px 14px;
    max-width: 1600px;
    width: 100%;
    margin: 14px auto 0;
  }

  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
  }

  .progress-stats { display: flex; gap: 14px; }
  .progress-stats span b { color: var(--text); font-weight: 700; }

  .progress-bar { height: 6px; background: var(--border); border-radius: var(--radius-pill); overflow: hidden; position: relative; }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary) 0%, #42A5F5 100%);
    border-radius: var(--radius-pill);
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
  }

  .progress-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    animation: progressShimmer 2s infinite;
  }

  @keyframes progressShimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  /* ===== BOARD ===== */
  .board {
    flex: 1;
    padding: 20px 28px;
    max-width: 1600px;
    width: 100%;
    margin: 0 auto;
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(280px, 1fr);
    gap: 20px;
    overflow-x: auto;
    scrollbar-width: thin;
  }

  .board::-webkit-scrollbar { height: 6px; }
  .board::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

  .column {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 18px;
    display: flex;
    flex-direction: column;
    min-height: 300px;
    max-height: calc(100vh - 260px);
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    transition: all 0.25s ease;
    position: relative;
  }

  /* Inbox badge on first column */
  .column.is-inbox::before {
    content: '📥 INBOX';
    position: absolute;
    top: -10px;
    right: 16px;
    background: var(--primary);
    color: white;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.08em;
    padding: 3px 8px;
    border-radius: var(--radius-pill);
    box-shadow: 0 2px 6px rgba(25, 118, 210, 0.4);
    z-index: 2;
  }

  .column.drag-over {
    background: var(--primary-bg);
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-bg), var(--shadow-md);
  }

  /* Column reorder indicators */
  .column.col-dragging { opacity: 0.4; }
  .column.col-drag-over-before {
    box-shadow: -4px 0 0 0 var(--primary), var(--shadow-md);
    transform: translateX(2px);
  }
  .column.col-drag-over-after {
    box-shadow: 4px 0 0 0 var(--primary), var(--shadow-md);
    transform: translateX(-2px);
  }

  .column.add-column {
    background: transparent;
    border: 2px dashed var(--border);
    box-shadow: none;
    align-items: center;
    justify-content: center;
    color: var(--text-subtle);
    cursor: pointer;
    min-height: 200px;
    max-height: 300px;
    transition: all 0.2s ease;
  }

  .column.add-column:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-bg); }
  .column.add-column svg { width: 28px; height: 28px; fill: currentColor; margin-bottom: 8px; }

  .column-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
    gap: 8px;
  }

  .column-title-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }

  /* Grip handle for column reordering */
  .col-drag-handle {
    width: 20px;
    height: 24px;
    border: none;
    background: transparent;
    color: var(--text-subtle);
    cursor: grab;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    opacity: 0;
    transition: all 0.15s ease;
    flex-shrink: 0;
    padding: 0;
  }

  .column:hover .col-drag-handle { opacity: 1; }
  .col-drag-handle:hover { background: var(--bg); color: var(--text); }
  .col-drag-handle:active { cursor: grabbing; }
  .col-drag-handle svg { width: 12px; height: 16px; fill: currentColor; }

  .column-indicator {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
    cursor: pointer;
    transition: all 0.15s ease;
    border: 2px solid var(--surface);
    box-shadow: 0 0 0 2px currentColor, var(--shadow-sm);
    position: relative;
  }

  .column-indicator:hover { transform: scale(1.25); }
  .column-indicator::after {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
  }

  .column-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.01em;
    cursor: text;
    padding: 2px 4px;
    border-radius: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: background 0.15s ease;
    min-width: 0;
    flex: 1;
  }

  .column-title:hover { background: var(--bg); }
  .column-title:focus { outline: none; background: var(--bg); box-shadow: 0 0 0 2px var(--primary); }

  .column-actions { display: flex; gap: 2px; }
  .column-actions button {
    width: 26px;
    height: 26px;
    border: none;
    background: transparent;
    color: var(--text-subtle);
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: all 0.15s ease;
  }
  .column:hover .column-actions button { opacity: 1; }
  .column-actions button:hover { background: var(--bg); color: var(--danger); }
  .column-actions button svg { width: 13px; height: 13px; fill: currentColor; }

  .column-count {
    background: var(--bg);
    color: var(--text-muted);
    padding: 2px 9px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .task-list {
    flex: 1;
    overflow-y: auto;
    padding-right: 4px;
    min-height: 60px;
  }

  .task-list::-webkit-scrollbar { width: 5px; }
  .task-list::-webkit-scrollbar-track { background: transparent; }
  .task-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    color: var(--text-subtle);
    font-size: 12px;
    text-align: center;
    border: 2px dashed var(--border);
    border-radius: var(--radius-sm);
    margin-top: 6px;
  }

  .empty-state svg { width: 24px; height: 24px; opacity: 0.4; margin-bottom: 6px; fill: var(--text-subtle); }

  /* ===== CARD ===== */
  .card {
    background: var(--surface);
    padding: 14px 14px 14px 18px;
    border-radius: var(--radius-sm);
    margin-bottom: 10px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    cursor: grab;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    user-select: none;
    -webkit-user-select: none;
    animation: cardIn 0.3s ease;
    overflow: hidden;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: var(--priority-color, transparent);
    transition: width 0.2s ease;
  }

  .card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: var(--primary-light); }
  .card:hover::before { width: 5px; }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: 0.4; transform: scale(0.98); }
  .card.overdue { background: linear-gradient(135deg, var(--surface) 0%, #FFF5F5 100%); }
  [data-theme="dark"] .card.overdue { background: linear-gradient(135deg, var(--surface) 0%, rgba(211,47,47,0.1) 100%); }

  .card-content {
    padding-right: 28px;
    word-wrap: break-word;
    line-height: 1.5;
    font-size: 14px;
    color: var(--text);
    cursor: text;
  }

  .card-content:focus {
    outline: none;
    background: var(--bg);
    border-radius: 4px;
    padding: 2px 4px;
    margin: -2px -4px;
  }

  .column[data-completion="true"] .card-content { text-decoration: line-through; color: var(--text-muted); }

  .card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-muted);
    gap: 6px;
    flex-wrap: wrap;
  }

  .card-meta-left { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .card-id { font-weight: 700; color: var(--primary); font-size: 10px; }

  .badge {
    padding: 2px 8px;
    border-radius: var(--radius-pill);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }

  .badge svg { width: 10px; height: 10px; fill: currentColor; }
  .badge-priority-low { background: rgba(56, 142, 60, 0.12); color: var(--success); }
  .badge-priority-medium { background: rgba(245, 124, 0, 0.12); color: var(--warning); }
  .badge-priority-high { background: rgba(211, 47, 47, 0.12); color: var(--danger); }
  .badge-priority-critical { background: rgba(136, 14, 79, 0.12); color: var(--critical); }

  .badge-deadline { background: var(--bg); color: var(--text-muted); display: inline-flex; align-items: center; gap: 3px; }
  .badge-deadline.overdue { background: rgba(211, 47, 47, 0.12); color: var(--danger); font-weight: 700; }
  .badge-deadline.urgent { background: rgba(245, 124, 0, 0.12); color: var(--warning); font-weight: 700; }
  .badge-deadline.soon { background: rgba(25, 118, 210, 0.12); color: var(--primary); }

  .card-controls {
    position: absolute;
    top: 8px;
    right: 8px;
    display: flex;
    gap: 2px;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .card:hover .card-controls { opacity: 1; }

  .card-controls button {
    width: 26px;
    height: 26px;
    border: none;
    background: var(--bg);
    color: var(--text-muted);
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }

  .card-controls button:hover { background: var(--border); }
  .card-controls .delete-btn:hover { background: #FFEBEE; color: var(--danger); }
  [data-theme="dark"] .card-controls .delete-btn:hover { background: rgba(211,47,47,0.2); }
  .card-controls button svg { width: 12px; height: 12px; fill: currentColor; }

  .card-edit-form {
    display: none;
    flex-direction: column;
    gap: 8px;
    padding: 8px 0;
    border-top: 1px solid var(--border);
    margin-top: 10px;
  }

  .card.editing .card-edit-form { display: flex; }
  .card.editing .card-meta { display: none; }

  .edit-row { display: flex; gap: 6px; align-items: center; }
  .edit-row label { font-size: 10px; color: var(--text-muted); font-weight: 600; min-width: 52px; text-transform: uppercase; letter-spacing: 0.04em; }
  .edit-row input, .edit-row select {
    flex: 1;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 12px;
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
  }
  .edit-row input:focus, .edit-row select:focus { outline: none; border-color: var(--primary); }

  /* Touch clone */
  .touch-clone {
    position: fixed;
    pointer-events: none;
    z-index: 1000;
    transform: rotate(2deg) scale(1.04);
    opacity: 0.95;
    box-shadow: var(--shadow-xl);
    will-change: transform;
  }

  .touch-clone.col-clone {
    transform: rotate(1deg) scale(1.02);
    max-width: 320px;
  }

  .drop-placeholder {
    height: 40px;
    border: 2px dashed var(--primary);
    border-radius: var(--radius-sm);
    margin-bottom: 10px;
    background: var(--primary-bg);
    animation: pulse 1s infinite;
  }

  @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

  /* ===== TOAST ===== */
  .toast-container {
    position: fixed;
    bottom: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 200;
    pointer-events: none;
  }

  .toast {
    background: var(--text);
    color: var(--surface);
    padding: 12px 18px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    box-shadow: var(--shadow-lg);
    display: flex;
    align-items: center;
    gap: 10px;
    animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
    pointer-events: auto;
    min-width: 220px;
    max-width: 340px;
  }

  @keyframes toastIn {
    from { transform: translateX(400px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  @keyframes toastOut { to { transform: translateX(400px); opacity: 0; } }

  .toast svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }
  .toast.success { background: var(--success); color: white; }
  .toast.error { background: var(--danger); color: white; }

  /* ===== CONFETTI ===== */
  .confetti-piece {
    position: fixed;
    width: 8px;
    height: 8px;
    pointer-events: none;
    z-index: 300;
    animation: confettiFall 2.5s ease-out forwards;
  }

  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  /* ===== MODAL ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 20, 25, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 500;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }

  .modal-overlay.open { opacity: 1; pointer-events: auto; }

  .modal {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 26px;
    width: 100%;
    max-width: 420px;
    box-shadow: var(--shadow-xl);
    transform: scale(0.92) translateY(10px);
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    border: 1px solid var(--border);
  }

  .modal-overlay.open .modal { transform: scale(1) translateY(0); }

  .modal-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: var(--primary-bg);
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
  }

  .modal-icon svg { width: 24px; height: 24px; fill: currentColor; }
  .modal-icon.warn { background: rgba(245, 124, 0, 0.12); color: var(--warning); }
  .modal-icon.danger { background: rgba(211, 47, 47, 0.12); color: var(--danger); }

  .modal-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  .modal-message {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 18px;
    line-height: 1.55;
  }

  .modal-input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
    transition: all 0.2s ease;
  }

  .modal-input:focus {
    outline: none;
    border-color: var(--primary);
    background: var(--surface);
    box-shadow: 0 0 0 4px var(--primary-bg);
  }

  /* Color grid */
  .color-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
    margin-bottom: 14px;
  }

  .color-swatch {
    aspect-ratio: 1;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s ease;
    border: 2px solid transparent;
    position: relative;
    box-shadow: var(--shadow-sm);
  }

  .color-swatch:hover { transform: scale(1.1); box-shadow: var(--shadow-md); }

  .color-swatch.selected {
    border-color: var(--text);
    transform: scale(1.1);
    box-shadow: 0 0 0 3px var(--primary-bg);
  }

  .color-swatch.selected::after {
    content: '✓';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 900;
    font-size: 14px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }

  .custom-color-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 6px;
  }

  .custom-color-row input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
    font-family: 'SF Mono', Menlo, Consolas, monospace;
  }

  .custom-color-row input[type="color"] {
    width: 42px;
    height: 40px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg);
    cursor: pointer;
    padding: 2px;
  }

  .custom-color-row label {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    min-width: 54px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 22px;
  }

  .modal-actions .btn { min-width: 88px; justify-content: center; }

  /* ===== FOOTER ===== */
  .footer {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 18px 28px;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    transition: all 0.3s ease;
  }

  .footer a { color: var(--primary); text-decoration: none; font-weight: 700; transition: color 0.2s ease; }
  .footer a:hover { color: var(--primary-dark); }
  .footer .heart { color: #E91E63; display: inline-block; animation: heartBeat 1.2s infinite; }

  @keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 900px) {
    .header { padding: 12px 16px; }
    .tabs-row { padding: 0 16px; }
    .add-bar { padding: 12px 16px; }
    .board { padding: 16px; gap: 14px; grid-auto-columns: 85%; }
    .column { max-height: none; }
    .toolbar { width: 100%; order: 3; justify-content: space-between; }
    .search-box { flex: 1; min-width: 120px; }
    .brand-title { font-size: 16px; }
    .brand-subtitle { font-size: 10px; }
    .card-controls { opacity: 1; }
    .column-actions button { opacity: 1; }
    .col-drag-handle { opacity: 1; }
    .progress-wrap { padding: 0 16px 10px; }
  }

  @media (max-width: 480px) {
    .board { grid-auto-columns: 92%; padding: 12px; }
    .brand-logo { width: 38px; height: 38px; }
    .brand-logo svg { width: 20px; height: 20px; }
    .add-bar-inner { gap: 6px; }
    .add-bar input[type="text"] { min-width: 100%; }
    .toast-container { bottom: 10px; right: 10px; left: 10px; }
    .toast { max-width: 100%; }
    .modal { padding: 22px 20px; }
    .color-grid { grid-template-columns: repeat(5, 1fr); }
  }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24"><path d="M3 3h7v7H3zm11 0h7v7h-7zM3 14h7v7H3zm11 0h7v7h-7z"/></svg>
        </div>
        <div>
          <div class="brand-title">Kanban Pro</div>
          <div class="brand-subtitle">Organize, Prioritize, Ship</div>
        </div>
      </div>

      <div class="toolbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="searchInput" placeholder="Search tasks...">
        </div>

        <button class="icon-btn" id="themeToggle" title="Toggle dark mode">
          <svg id="themeIcon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
        </button>

        <div class="dropdown" id="clearDropdown">
          <button class="icon-btn" id="clearBtn" title="More actions">
            <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
          </button>
          <div class="dropdown-menu">
            <button class="dropdown-item" data-action="clear-done">
              <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
              Clear completed
            </button>
            <button class="dropdown-item" data-action="clear-all">
              <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
              Clear all tasks
            </button>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item danger" data-action="delete-board">
              <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
              Delete this board
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="tabs-row" id="tabsRow"></div>

  <div class="add-bar">
    <form class="add-bar-inner" id="taskForm">
      <input type="text" id="taskInput" placeholder="✍️ What needs to be done?" maxlength="200" required>
      <input type="date" id="taskDeadline" title="Set deadline">
      <select id="taskPriority" title="Set priority">
        <option value="none">No priority</option>
        <option value="low">🟢 Low</option>
        <option value="medium" selected>🟡 Medium</option>
        <option value="high">🟠 High</option>
        <option value="critical">🔴 Critical</option>
      </select>
      <button type="submit" class="btn btn-primary" id="addBtn">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
        Add Task
      </button>
    </form>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-header">
      <span id="progressLabel">Project progress</span>
      <div class="progress-stats" id="progressStats"></div>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>
  </div>

  <main class="board" id="board"></main>

  <div class="toast-container" id="toastContainer"></div>

  <footer class="footer">
    Crafted with <span class="heart">♥</span> by <a href="#">Code With Q</a> · © 2026 · Drag, drop, ship.
  </footer>
</div>

<script>
(function() {
  'use strict';

  const STORAGE_KEY = 'kanban_pro_v2';
  const PRIORITY_COLORS = {
    none: 'transparent',
    low: '#388E3C',
    medium: '#F57C00',
    high: '#D32F2F',
    critical: '#880E4F'
  };

  const PALETTE = [
    '#1976D2', '#42A5F5', '#00ACC1', '#26A69A', '#66BB6A', '#388E3C',
    '#F57C00', '#FB8C00', '#FFA726', '#EF5350', '#E91E63', '#AB47BC',
    '#8E24AA', '#5E35B1', '#5C6BC0', '#795548', '#607D8B', '#263238'
  ];

  let state = {
    boards: [],
    activeBoardId: null,
    theme: 'light',
    taskCounter: 1,
    boardCounter: 1,
    columnCounter: 1
  };

  // ============ Storage ============
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) state = Object.assign(state, JSON.parse(raw));
    } catch (e) {}
  }

  function getActiveBoard() {
    return state.boards.find(b => b.id === state.activeBoardId) || state.boards[0];
  }

  function createDefaultBoard(name) {
    return {
      id: state.boardCounter++,
      name: name || 'New Project',
      columns: [
        { id: 'todo', name: 'To Do', color: '#1976D2' },
        { id: 'inprogress', name: 'In Progress', color: '#F57C00' },
        { id: 'done', name: 'Done', color: '#388E3C', isDone: true }
      ],
      tasks: {}
    };
  }

  // ============ Modal System ============
  const Modal = (() => {
    let overlay = null;
    let modal = null;
    let currentResolve = null;
    let keyHandler = null;

    function ensureCreated() {
      if (overlay) return;
      overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = '<div class="modal" role="dialog" aria-modal="true"></div>';
      modal = overlay.querySelector('.modal');
      document.body.appendChild(overlay);

      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) close(null);
      });
    }

    function show({
      title = '',
      message = '',
      type = 'prompt',
      defaultValue = '',
      placeholder = '',
      confirmText = 'Confirm',
      cancelText = 'Cancel',
      icon = 'info',
      colors = null,
      selectedColor = null
    }) {
      ensureCreated();
      return new Promise((resolve) => {
        currentResolve = resolve;

        let iconSvg = '';
        let iconClass = '';
        if (icon === 'edit') {
          iconSvg = '<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>';
        } else if (icon === 'color') {
          iconSvg = '<svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.27-.38-.62-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>';
        } else if (icon === 'warn') {
          iconSvg = '<svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>';
          iconClass = ' warn';
        } else if (icon === 'danger') {
          iconSvg = '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>';
          iconClass = ' danger';
        } else if (icon === 'add') {
          iconSvg = '<svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>';
        } else {
          iconSvg = '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>';
        }

        let contentHtml = '<div class="modal-icon' + iconClass + '">' + iconSvg + '</div>';
        if (title) contentHtml += '<div class="modal-title">' + escapeHtml(title) + '</div>';
        if (message) contentHtml += '<div class="modal-message">' + escapeHtml(message) + '</div>';

        if (type === 'prompt') {
          contentHtml += '<input type="text" class="modal-input" value="' + escapeHtml(defaultValue) + '" placeholder="' + escapeHtml(placeholder) + '" maxlength="100">';
        } else if (type === 'color') {
          contentHtml += '<div class="color-grid">';
          (colors || PALETTE).forEach(c => {
            const selected = (selectedColor === c) ? ' selected' : '';
            contentHtml += '<div class="color-swatch' + selected + '" data-color="' + c + '" style="background:' + c + '"></div>';
          });
          contentHtml += '</div>';
          contentHtml += '<div class="custom-color-row">' +
            '<label>Custom</label>' +
            '<input type="text" class="custom-hex" placeholder="#000000" value="' + escapeHtml(selectedColor || '') + '">' +
            '<input type="color" class="custom-picker" value="' + (selectedColor || '#1976D2') + '">' +
          '</div>';
        }

        contentHtml += '<div class="modal-actions">';
        if (type !== 'alert') {
          contentHtml += '<button class="btn btn-ghost modal-cancel">' + escapeHtml(cancelText) + '</button>';
        }
        contentHtml += '<button class="btn btn-primary modal-confirm">' + escapeHtml(confirmText) + '</button>';
        contentHtml += '</div>';

        modal.innerHTML = contentHtml;

        const input = modal.querySelector('.modal-input');
        if (input) {
          setTimeout(() => { input.focus(); input.select(); }, 50);
        }

        if (type === 'color') {
          const swatches = modal.querySelectorAll('.color-swatch');
          const hexInput = modal.querySelector('.custom-hex');
          const picker = modal.querySelector('.custom-picker');

          swatches.forEach(sw => {
            sw.addEventListener('click', () => {
              swatches.forEach(s => s.classList.remove('selected'));
              sw.classList.add('selected');
              hexInput.value = sw.dataset.color;
              picker.value = sw.dataset.color;
            });
          });

          hexInput.addEventListener('input', () => {
            const val = hexInput.value.trim();
            if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
              swatches.forEach(s => s.classList.remove('selected'));
              try { picker.value = val; } catch (e) {}
            }
          });

          picker.addEventListener('input', () => {
            hexInput.value = picker.value;
            swatches.forEach(s => s.classList.remove('selected'));
          });
        }

        modal.querySelector('.modal-cancel')?.addEventListener('click', () => close(null));
        modal.querySelector('.modal-confirm').addEventListener('click', () => {
          if (type === 'prompt') {
            const val = modal.querySelector('.modal-input').value.trim();
            close(val || null);
          } else if (type === 'color') {
            let selected = null;
            const selSwatch = modal.querySelector('.color-swatch.selected');
            const hexVal = modal.querySelector('.custom-hex').value.trim();
            if (/^#[0-9A-Fa-f]{6}$/.test(hexVal)) selected = hexVal;
            else if (selSwatch) selected = selSwatch.dataset.color;
            close(selected);
          } else {
            close(true);
          }
        });

        if (input) {
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              modal.querySelector('.modal-confirm').click();
            }
          });
        }

        keyHandler = (e) => {
          if (e.key === 'Escape') close(null);
        };
        document.addEventListener('keydown', keyHandler);

        overlay.classList.add('open');
      });
    }

    function close(value) {
      if (!overlay) return;
      overlay.classList.remove('open');
      if (keyHandler) {
        document.removeEventListener('keydown', keyHandler);
        keyHandler = null;
      }
      if (currentResolve) {
        const r = currentResolve;
        currentResolve = null;
        setTimeout(() => r(value), 200);
      }
    }

    return {
      prompt: (opts) => show({ ...opts, type: 'prompt' }),
      confirm: (opts) => show({ ...opts, type: 'confirm', confirmText: opts.confirmText || 'Yes', icon: opts.icon || 'warn' }),
      alert: (opts) => show({ ...opts, type: 'alert', confirmText: 'OK' }),
      color: (opts) => show({ ...opts, type: 'color', confirmText: 'Apply', icon: 'color' })
    };
  })();

  // ============ Toast ============
  function toast(msg, type = 'info') {
    const container = document.getElementById('toastContainer');
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    const icons = {
      success: '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>',
      error: '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>',
      info: '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>'
    };
    el.innerHTML = (icons[type] || icons.info) + '<span>' + msg + '</span>';
    container.appendChild(el);
    setTimeout(() => el.remove(), 3200);
  }

  // ============ Confetti ============
  function confetti() {
    const colors = ['#1976D2', '#42A5F5', '#FF5722', '#FFEB3B', '#4CAF50', '#E91E63'];
    for (let i = 0; i < 60; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDelay = (Math.random() * 0.5) + 's';
      piece.style.animationDuration = (2 + Math.random() * 1.5) + 's';
      if (Math.random() > 0.5) piece.style.borderRadius = '50%';
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 4000);
    }
  }
