  // ============ Rendering ============
  function renderTabs() {
    const row = document.getElementById('tabsRow');
    row.innerHTML = '';
    state.boards.forEach(board => {
      const totalTasks = board.columns.reduce((sum, col) => sum + (board.tasks[col.id] || []).length, 0);
      const tab = document.createElement('button');
      tab.className = 'tab' + (board.id === state.activeBoardId ? ' active' : '');
      tab.innerHTML =
        '<span class="tab-name">' + escapeHtml(board.name) + '</span>' +
        '<span class="tab-count">' + totalTasks + '</span>' +
        (state.boards.length > 1 ?
          '<span class="tab-close" data-board="' + board.id + '"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></span>' : '');
      tab.addEventListener('click', async (e) => {
        if (e.target.closest('.tab-close')) {
          e.stopPropagation();
          const ok = await Modal.confirm({
            title: 'Delete board?',
            message: 'This will permanently delete "' + board.name + '" and all its tasks. This action cannot be undone.',
            confirmText: 'Delete',
            cancelText: 'Keep',
            icon: 'danger'
          });
          if (ok) deleteBoard(board.id);
          return;
        }
        if (state.activeBoardId !== board.id) {
          state.activeBoardId = board.id;
          save();
          render();
        }
      });
      tab.addEventListener('dblclick', async (e) => {
        e.stopPropagation();
        const newName = await Modal.prompt({
          title: 'Rename board',
          message: 'Enter a new name for this project board.',
          defaultValue: board.name,
          placeholder: 'Board name',
          confirmText: 'Rename',
          icon: 'edit'
        });
        if (newName) {
          board.name = newName;
          save();
          renderTabs();
        }
      });
      row.appendChild(tab);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'tab-add';
    addBtn.title = 'Add new board';
    addBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>';
    addBtn.addEventListener('click', addBoard);
    row.appendChild(addBtn);
  }

  function renderBoard() {
    const board = getActiveBoard();
    if (!board) return;
    const boardEl = document.getElementById('board');
    boardEl.innerHTML = '';

    const searchTerm = (document.getElementById('searchInput').value || '').toLowerCase().trim();

    board.columns.forEach((col, colIdx) => {
      const tasks = board.tasks[col.id] || [];
      const column = document.createElement('div');
      column.className = 'column';
      if (colIdx === 0) column.classList.add('is-inbox');
      column.dataset.status = col.id;
      column.dataset.colId = col.id;
      if (col.isDone) column.dataset.completion = 'true';

      const visibleTasks = searchTerm
        ? tasks.filter(t => t.text.toLowerCase().includes(searchTerm))
        : tasks;

      const indicatorStyle = 'background:' + col.color + ';color:' + col.color;

      column.innerHTML =
        '<div class="column-header">' +
          '<button class="col-drag-handle" title="Drag to reorder"><svg viewBox="0 0 12 18"><circle cx="3" cy="3" r="1.5"/><circle cx="9" cy="3" r="1.5"/><circle cx="3" cy="9" r="1.5"/><circle cx="9" cy="9" r="1.5"/><circle cx="3" cy="15" r="1.5"/><circle cx="9" cy="15" r="1.5"/></svg></button>' +
          '<div class="column-indicator" title="Change color" style="' + indicatorStyle + '"></div>' +
          '<div class="column-title-wrap">' +
            '<div class="column-title" contenteditable="false" spellcheck="false">' + escapeHtml(col.name) + '</div>' +
          '</div>' +
          '<span class="column-count">' + tasks.length + '</span>' +
          '<div class="column-actions">' +
            '<button class="col-delete" title="Delete column"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>' +
          '</div>' +
        '</div>' +
        '<div class="task-list" data-list="' + col.id + '"></div>';

      const list = column.querySelector('.task-list');

      if (visibleTasks.length === 0) {
        list.innerHTML =
          '<div class="empty-state">' +
            '<svg viewBox="0 0 24 24"><path d="M19 5v14H5V5h14m0-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>' +
            (searchTerm ? 'No matching tasks' : (colIdx === 0 ? 'Drop tasks here or add above' : 'No tasks yet')) +
          '</div>';
      } else {
        visibleTasks.forEach(task => list.appendChild(createCardElement(task, col)));
      }

      // Indicator click — change color
      column.querySelector('.column-indicator').addEventListener('click', async (e) => {
        e.stopPropagation();
        const newColor = await Modal.color({
          title: 'Column color',
          message: 'Pick a color for "' + col.name + '" indicator.',
          selectedColor: col.color,
          colors: PALETTE
        });
        if (newColor) {
          col.color = newColor;
          save();
          renderBoard();
          toast('Color updated', 'success');
        }
      });

      // Column title editing
      const titleEl = column.querySelector('.column-title');
      titleEl.addEventListener('dblclick', () => {
        titleEl.contentEditable = 'true';
        titleEl.focus();
        document.getSelection().selectAllChildren(titleEl);
      });
      titleEl.addEventListener('blur', () => {
        titleEl.contentEditable = 'false';
        const newName = titleEl.textContent.trim();
        if (newName && newName !== col.name) {
          col.name = newName;
          save();
          toast('Column renamed', 'success');
        } else {
          titleEl.textContent = col.name;
        }
      });
      titleEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); titleEl.blur(); }
        if (e.key === 'Escape') { titleEl.textContent = col.name; titleEl.blur(); }
      });

      // Column delete
      column.querySelector('.col-delete').addEventListener('click', async () => {
        if (board.columns.length <= 1) {
          await Modal.alert({ title: 'Cannot delete', message: 'You need at least one column on the board.', icon: 'warn' });
          return;
        }
        if (tasks.length > 0) {
          const ok = await Modal.confirm({
            title: 'Delete column?',
            message: '"' + col.name + '" contains ' + tasks.length + ' task(s). They will be permanently deleted.',
            confirmText: 'Delete',
            icon: 'danger'
          });
          if (!ok) return;
        } else {
          const ok = await Modal.confirm({
            title: 'Delete "' + col.name + '"?',
            message: 'This column will be removed from the board.',
            confirmText: 'Delete',
            icon: 'warn'
          });
          if (!ok) return;
        }
        board.columns = board.columns.filter(c => c.id !== col.id);
        delete board.tasks[col.id];
        save();
        renderBoard();
        renderTabs();
        toast('Column deleted', 'success');
      });

      // Card DnD events
      column.addEventListener('dragover', onDragOver);
      column.addEventListener('dragleave', onDragLeave);
      column.addEventListener('drop', onDrop);

      // Column DnD events (reordering)
      column.addEventListener('dragover', onColumnDragOver);
      column.addEventListener('dragleave', onColumnDragLeave);
      column.addEventListener('drop', onColumnDrop);

      boardEl.appendChild(column);
    });

    // Add column button
    const addCol = document.createElement('div');
    addCol.className = 'column add-column';
    addCol.innerHTML =
      '<svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>' +
      '<span style="font-size:13px;font-weight:600">Add column</span>';
    addCol.addEventListener('click', addColumn);
    boardEl.appendChild(addCol);

    // Set up column drag handles
    boardEl.querySelectorAll('.col-drag-handle').forEach(handle => {
      handle.draggable = true;
      handle.addEventListener('dragstart', onColumnHandleDragStart);
      handle.addEventListener('dragend', onColumnDragEnd);
      handle.addEventListener('touchstart', onColumnHandleTouchStart, { passive: false });
    });

    renderProgress();
  }

  function createCardElement(task, col) {
    const card = document.createElement('div');
    card.className = 'card';
    card.draggable = true;
    card.dataset.id = task.id;
    const priorityColor = PRIORITY_COLORS[task.priority] || PRIORITY_COLORS.none;
    card.style.setProperty('--priority-color', priorityColor);

    const created = new Date(task.created);
    const dateStr = created.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    const deadlineInfo = task.deadline ? getDeadlineInfo(task.deadline, col.isDone) : null;

    if (deadlineInfo && deadlineInfo.status === 'overdue') card.classList.add('overdue');

    let metaHtml = '<span class="card-id">#' + task.id + '</span>';
    if (task.priority && task.priority !== 'none') {
      metaHtml += '<span class="badge badge-priority-' + task.priority + '">' +
        (task.priority === 'critical' ? '⚡ ' : '') +
        task.priority + '</span>';
    }
    if (deadlineInfo) {
      metaHtml += '<span class="badge badge-deadline ' + deadlineInfo.status + '">' +
        '<svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>' +
        deadlineInfo.label + '</span>';
    }

    card.innerHTML =
      '<div class="card-controls">' +
        '<button class="edit-btn" title="Edit"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></button>' +
        '<button class="delete-btn" title="Delete"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>' +
      '</div>' +
      '<div class="card-content">' + escapeHtml(task.text) + '</div>' +
      '<div class="card-meta">' +
        '<div class="card-meta-left">' + metaHtml + '</div>' +
        '<span>' + dateStr + '</span>' +
      '</div>' +
      '<div class="card-edit-form">' +
        '<div class="edit-row"><label>Text</label><input type="text" class="edit-text" value="' + escapeHtml(task.text) + '"></div>' +
        '<div class="edit-row"><label>Deadline</label><input type="date" class="edit-deadline" value="' + (task.deadline || '') + '"></div>' +
        '<div class="edit-row"><label>Priority</label><select class="edit-priority">' +
          '<option value="none"' + (task.priority === 'none' ? ' selected' : '') + '>None</option>' +
          '<option value="low"' + (task.priority === 'low' ? ' selected' : '') + '>Low</option>' +
          '<option value="medium"' + (task.priority === 'medium' ? ' selected' : '') + '>Medium</option>' +
          '<option value="high"' + (task.priority === 'high' ? ' selected' : '') + '>High</option>' +
          '<option value="critical"' + (task.priority === 'critical' ? ' selected' : '') + '>Critical</option>' +
        '</select></div>' +
      '</div>';

    const content = card.querySelector('.card-content');
    content.addEventListener('click', (e) => {
      e.stopPropagation();
      content.contentEditable = 'true';
      content.focus();
      document.getSelection().selectAllChildren(content);
    });
    content.addEventListener('blur', () => {
      content.contentEditable = 'false';
      const newText = content.textContent.trim();
      if (newText && newText !== task.text) {
        task.text = newText;
        save();
      } else {
        content.textContent = task.text;
      }
    });
    content.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); content.blur(); }
      if (e.key === 'Escape') { content.textContent = task.text; content.blur(); }
    });

    card.querySelector('.edit-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      card.classList.toggle('editing');
    });

    card.querySelector('.delete-btn').addEventListener('click', async (e) => {
      e.stopPropagation();
      const ok = await Modal.confirm({
        title: 'Delete task?',
        message: '"' + task.text + '" will be permanently deleted.',
        confirmText: 'Delete',
        icon: 'danger'
      });
      if (ok) {
        deleteTask(task.id);
        toast('Task deleted', 'success');
      }
    });

    const editForm = card.querySelector('.card-edit-form');
    editForm.querySelector('.edit-text').addEventListener('change', (e) => {
      task.text = e.target.value.trim() || task.text;
      content.textContent = task.text;
      save();
    });
    editForm.querySelector('.edit-deadline').addEventListener('change', (e) => {
      task.deadline = e.target.value || null;
      save();
      renderBoard();
    });
    editForm.querySelector('.edit-priority').addEventListener('change', (e) => {
      task.priority = e.target.value;
      card.style.setProperty('--priority-color', PRIORITY_COLORS[task.priority] || 'transparent');
      save();
      renderBoard();
    });

    card.addEventListener('dragstart', onDragStart);
    card.addEventListener('dragend', onDragEnd);
    card.addEventListener('touchstart', onTouchStart, { passive: false });

    return card;
  }

  function getDeadlineInfo(dateStr, isDone) {
    if (!dateStr) return null;
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const deadline = new Date(dateStr + 'T00:00:00');
    const diffDays = Math.round((deadline - today) / (1000 * 60 * 60 * 24));
    const label = deadline.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    if (isDone) return { status: '', label: label };
    if (diffDays < 0) return { status: 'overdue', label: 'Overdue · ' + label };
    if (diffDays === 0) return { status: 'urgent', label: 'Today' };
    if (diffDays <= 2) return { status: 'urgent', label: diffDays + 'd left' };
    if (diffDays <= 7) return { status: 'soon', label: diffDays + 'd left' };
    return { status: '', label: label };
  }

  function renderProgress() {
    const board = getActiveBoard();
    if (!board) return;
    const doneCol = board.columns.find(c => c.isDone);
    const allTasks = board.columns.reduce((sum, col) => sum + (board.tasks[col.id] || []).length, 0);
    const doneTasks = doneCol ? (board.tasks[doneCol.id] || []).length : 0;
    const overdue = board.columns.reduce((sum, col) => {
      if (col.isDone) return sum;
      return sum + (board.tasks[col.id] || []).filter(t => {
        const info = getDeadlineInfo(t.deadline, false);
        return info && info.status === 'overdue';
      }).length;
    }, 0);

    const percent = allTasks === 0 ? 0 : Math.round((doneTasks / allTasks) * 100);
    document.getElementById('progressFill').style.width = percent + '%';
    document.getElementById('progressLabel').textContent = board.name + ' · ' + percent + '% complete';
    document.getElementById('progressStats').innerHTML =
      '<span><b>' + allTasks + '</b> total</span>' +
      '<span><b>' + doneTasks + '</b> done</span>' +
      (overdue > 0 ? '<span style="color:var(--danger)"><b>' + overdue + '</b> overdue</span>' : '');

    if (allTasks > 0 && doneTasks === allTasks) {
      const key = 'confetti_' + board.id + '_' + allTasks;
      if (!sessionStorage.getItem(key)) {
        confetti();
        sessionStorage.setItem(key, '1');
        toast('🎉 All tasks completed!', 'success');
      }
    }
  }

  function render() {
    renderTabs();
    renderBoard();
  }

  // ============ Task Ops ============
  function addTask(text, deadline, priority) {
    const board = getActiveBoard();
    if (!board) return;
    const firstCol = board.columns[0];
    if (!board.tasks[firstCol.id]) board.tasks[firstCol.id] = [];
    board.tasks[firstCol.id].unshift({
      id: state.taskCounter++,
      text: text.trim(),
      created: Date.now(),
      deadline: deadline || null,
      priority: priority || 'none'
    });
    sessionStorage.removeItem('confetti_' + board.id + '_' + (getAllTaskCount(board)));
    save();
    renderBoard();
    renderTabs();
  }

  function getAllTaskCount(board) {
    return board.columns.reduce((s, c) => s + (board.tasks[c.id] || []).length, 0);
  }

  function deleteTask(id) {
    const board = getActiveBoard();
    if (!board) return;
    board.columns.forEach(col => {
      if (board.tasks[col.id]) {
        board.tasks[col.id] = board.tasks[col.id].filter(t => t.id !== id);
      }
    });
    save();
    renderBoard();
    renderTabs();
  }

  function moveTask(id, toStatus, beforeId) {
    const board = getActiveBoard();
    if (!board) return;
    let task = null;
    board.columns.forEach(col => {
      if (board.tasks[col.id]) {
        const idx = board.tasks[col.id].findIndex(t => t.id === id);
        if (idx >= 0) task = board.tasks[col.id].splice(idx, 1)[0];
      }
    });
    if (!task) return;
    if (!board.tasks[toStatus]) board.tasks[toStatus] = [];
    const targetArr = board.tasks[toStatus];
    if (beforeId !== null && beforeId !== undefined) {
      const beforeIdx = targetArr.findIndex(t => t.id === beforeId);
      if (beforeIdx >= 0) targetArr.splice(beforeIdx, 0, task);
      else targetArr.push(task);
    } else {
      targetArr.push(task);
    }
    save();
    renderBoard();
  }

  // ============ Board Ops ============
  async function addBoard() {
    const name = await Modal.prompt({
      title: 'New project board',
      message: 'Give your new board a name to start organizing tasks.',
      placeholder: 'e.g. Marketing Q3, App Redesign',
      defaultValue: 'Project ' + (state.boards.length + 1),
      confirmText: 'Create',
      icon: 'add'
    });
    if (!name) return;
    const board = createDefaultBoard(name);
    state.boards.push(board);
    state.activeBoardId = board.id;
    save();
    render();
    toast('Board "' + board.name + '" created', 'success');
  }

  function deleteBoard(id) {
    state.boards = state.boards.filter(b => b.id !== id);
    if (state.activeBoardId === id) state.activeBoardId = state.boards[0]?.id || null;
    if (state.boards.length === 0) {
      state.boards.push(createDefaultBoard('My Project'));
      state.activeBoardId = state.boards[0].id;
    }
    save();
    render();
    toast('Board deleted', 'success');
  }

  async function addColumn() {
    const name = await Modal.prompt({
      title: 'Add column',
      message: 'Enter a name for the new status column.',
      placeholder: 'e.g. Review, Backlog, Blocked',
      confirmText: 'Add',
      icon: 'add'
    });
    if (!name) return;
    const board = getActiveBoard();
    const colors = PALETTE;
    const color = colors[board.columns.length % colors.length];
    const col = { id: 'col_' + (state.columnCounter++), name: name, color: color };
    board.columns.push(col);
    board.tasks[col.id] = [];
    save();
    renderBoard();
    toast('Column "' + name + '" added', 'success');
  }

  async function clearDone() {
    const board = getActiveBoard();
    if (!board) return;
    const doneCol = board.columns.find(c => c.isDone);
    if (!doneCol) { toast('No "Done" column found', 'error'); return; }
    const count = (board.tasks[doneCol.id] || []).length;
    if (count === 0) { toast('Nothing to clear', 'info'); return; }
    const ok = await Modal.confirm({
      title: 'Clear completed tasks?',
      message: count + ' completed task(s) will be permanently removed.',
      confirmText: 'Clear',
      icon: 'warn'
    });
    if (!ok) return;
    board.tasks[doneCol.id] = [];
    save();
    renderBoard();
    renderTabs();
    toast(count + ' task(s) cleared', 'success');
  }

  async function clearAll() {
    const board = getActiveBoard();
    if (!board) return;
    const total = board.columns.reduce((s, c) => s + (board.tasks[c.id] || []).length, 0);
    if (total === 0) { toast('Board already empty', 'info'); return; }
    const ok = await Modal.confirm({
      title: 'Clear all tasks?',
      message: 'This will delete ALL ' + total + ' task(s) on this board. This cannot be undone.',
      confirmText: 'Clear all',
      icon: 'danger'
    });
    if (!ok) return;
    board.columns.forEach(c => board.tasks[c.id] = []);
    save();
    renderBoard();
    renderTabs();
    toast('Board cleared', 'success');
  }

  // ============ DnD: Cards (Desktop) ============
  let draggedId = null;

  function onDragStart(e) {
    // Only card drag (card itself has draggable, not column)
    if (!this.classList.contains('card')) return;
    draggedId = parseInt(this.dataset.id);
    this.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', String(draggedId)); } catch (err) {}
  }

  function onDragEnd() {
    if (!this.classList.contains('card')) return;
    this.classList.remove('dragging');
    document.querySelectorAll('.column').forEach(c => c.classList.remove('drag-over'));
    draggedId = null;
  }

  function onDragOver(e) {
    if (draggedId === null) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    this.classList.add('drag-over');
  }

  function onDragLeave(e) {
    if (draggedId === null) return;
    if (!this.contains(e.relatedTarget)) this.classList.remove('drag-over');
  }

  function onDrop(e) {
    if (draggedId === null) return;
    e.preventDefault();
    this.classList.remove('drag-over');
    const id = draggedId;
    const status = this.dataset.status;
    const list = this.querySelector('.task-list');
    const cards = Array.from(list.querySelectorAll('.card:not(.dragging)'));
    let beforeId = null;
    for (let i = 0; i < cards.length; i++) {
      const rect = cards[i].getBoundingClientRect();
      if (e.clientY < rect.top + rect.height / 2) {
        beforeId = parseInt(cards[i].dataset.id);
        break;
      }
    }
    moveTask(id, status, beforeId);
  }

  // ============ DnD: Cards (Touch) ============
  let touchDrag = null;

  function onTouchStart(e) {
    if (e.target.closest('button, input, select, .card-controls, [contenteditable="true"]')) return;
    const touch = e.touches[0];
    const card = this;
    touchDrag = {
      card: card,
      id: parseInt(card.dataset.id),
      startX: touch.clientX,
      startY: touch.clientY,
      moved: false,
      clone: null,
      timer: setTimeout(() => { if (touchDrag) startTouchDrag(); }, 200)
    };
    card.addEventListener('touchmove', onTouchMove, { passive: false });
    card.addEventListener('touchend', onTouchEnd);
    card.addEventListener('touchcancel', onTouchEnd);
  }

  function startTouchDrag() {
    if (!touchDrag) return;
    const card = touchDrag.card;
    card.classList.add('dragging');
    const clone = card.cloneNode(true);
    clone.classList.add('touch-clone');
    const rect = card.getBoundingClientRect();
    clone.style.width = rect.width + 'px';
    clone.style.left = rect.left + 'px';
    clone.style.top = rect.top + 'px';
    document.body.appendChild(clone);
    touchDrag.clone = clone;
    touchDrag.moved = true;
  }

  function onTouchMove(e) {
    if (!touchDrag) return;
    const touch = e.touches[0];
    const dx = touch.clientX - touchDrag.startX;
    const dy = touch.clientY - touchDrag.startY;
    if (!touchDrag.moved && Math.hypot(dx, dy) > 8) {
      clearTimeout(touchDrag.timer);
      startTouchDrag();
    }
    if (touchDrag.moved) {
      e.preventDefault();
      const clone = touchDrag.clone;
      if (clone) {
        clone.style.left = (touch.clientX - clone.offsetWidth / 2) + 'px';
        clone.style.top = (touch.clientY - clone.offsetHeight / 2) + 'px';
        clone.style.display = 'none';
      }
      const el = document.elementFromPoint(touch.clientX, touch.clientY);
      if (clone) clone.style.display = '';
      const column = el ? el.closest('.column') : null;
      document.querySelectorAll('.column').forEach(c => c.classList.remove('drag-over'));
      if (column) column.classList.add('drag-over');
      touchDrag.overColumn = column;
    }
  }

  function onTouchEnd(e) {
    if (!touchDrag) return;
    clearTimeout(touchDrag.timer);
    const card = touchDrag.card;
    const clone = touchDrag.clone;
    const overColumn = touchDrag.overColumn;
    card.classList.remove('dragging');
    document.querySelectorAll('.column').forEach(c => c.classList.remove('drag-over'));
    if (clone) clone.remove();
    if (touchDrag.moved && overColumn) {
      const status = overColumn.dataset.status;
      let beforeId = null;
      const list = overColumn.querySelector('.task-list');
      const cards = Array.from(list.querySelectorAll('.card:not(.dragging)'));
      const touch = e.changedTouches[0];
      for (let i = 0; i < cards.length; i++) {
        const rect = cards[i].getBoundingClientRect();
        if (touch.clientY < rect.top + rect.height / 2) {
          beforeId = parseInt(cards[i].dataset.id);
          break;
        }
      }
      moveTask(touchDrag.id, status, beforeId);
    }
    card.removeEventListener('touchmove', onTouchMove);
    card.removeEventListener('touchend', onTouchEnd);
    card.removeEventListener('touchcancel', onTouchEnd);
    touchDrag = null;
  }

  // ============ DnD: Columns (Reorder) ============
  let columnDragId = null;
  let columnTouchDrag = null;

  function onColumnHandleDragStart(e) {
    const column = this.closest('.column');
    columnDragId = column.dataset.colId;
    column.classList.add('col-dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('application/x-column', columnDragId); } catch (err) {}
    try {
      e.dataTransfer.setDragImage(column, column.offsetWidth / 2, 30);
    } catch (err) {}
  }

  function onColumnDragEnd() {
    document.querySelectorAll('.column').forEach(c => {
      c.classList.remove('col-dragging', 'col-drag-over-before', 'col-drag-over-after');
    });
    columnDragId = null;
  }

  function onColumnDragOver(e) {
    if (!columnDragId) return;
    if (this.dataset.colId === columnDragId) return;
    e.preventDefault();
    e.stopPropagation();
    const rect = this.getBoundingClientRect();
    const midpoint = rect.left + rect.width / 2;
    this.classList.remove('col-drag-over-before', 'col-drag-over-after');
    if (e.clientX < midpoint) this.classList.add('col-drag-over-before');
    else this.classList.add('col-drag-over-after');
  }

  function onColumnDragLeave(e) {
    if (!columnDragId) return;
    if (!this.contains(e.relatedTarget)) {
      this.classList.remove('col-drag-over-before', 'col-drag-over-after');
    }
  }

  function onColumnDrop(e) {
    if (!columnDragId) return;
    e.preventDefault();
    e.stopPropagation();
    const targetColId = this.dataset.colId;
    if (targetColId === columnDragId) {
      document.querySelectorAll('.column').forEach(c => {
        c.classList.remove('col-drag-over-before', 'col-drag-over-after');
      });
      return;
    }
    const rect = this.getBoundingClientRect();
    const midpoint = rect.left + rect.width / 2;
    const before = e.clientX < midpoint;
    reorderColumn(columnDragId, targetColId, before);
    document.querySelectorAll('.column').forEach(c => {
      c.classList.remove('col-drag-over-before', 'col-drag-over-after', 'col-dragging');
    });
    columnDragId = null;
    toast('Column reordered', 'success');
  }

  function reorderColumn(draggedId, targetId, before) {
    const board = getActiveBoard();
    const cols = board.columns;
    const fromIdx = cols.findIndex(c => c.id === draggedId);
    if (fromIdx < 0) return;
    const [draggedCol] = cols.splice(fromIdx, 1);
    let toIdx = cols.findIndex(c => c.id === targetId);
    if (!before) toIdx += 1;
    cols.splice(toIdx, 0, draggedCol);
    save();
    renderBoard();
  }

  // Touch-based column reorder
  function onColumnHandleTouchStart(e) {
    e.preventDefault();
    e.stopPropagation();
    const touch = e.touches[0];
    const column = this.closest('.column');
    const clone = column.cloneNode(true);
    clone.classList.add('touch-clone', 'col-clone');
    const rect = column.getBoundingClientRect();
    clone.style.width = rect.width + 'px';
    clone.style.left = rect.left + 'px';
    clone.style.top = rect.top + 'px';
    document.body.appendChild(clone);
    column.classList.add('col-dragging');

    columnTouchDrag = {
      column: column,
      colId: column.dataset.colId,
      clone: clone,
      offsetX: touch.clientX - rect.left,
      offsetY: touch.clientY - rect.top
    };

    document.addEventListener('touchmove', onColumnTouchMove, { passive: false });
    document.addEventListener('touchend', onColumnTouchEnd);
    document.addEventListener('touchcancel', onColumnTouchEnd);
  }

  function onColumnTouchMove(e) {
    if (!columnTouchDrag) return;
    e.preventDefault();
    const touch = e.touches[0];
    const clone = columnTouchDrag.clone;
    clone.style.left = (touch.clientX - columnTouchDrag.offsetX) + 'px';
    clone.style.top = (touch.clientY - columnTouchDrag.offsetY) + 'px';

    clone.style.visibility = 'hidden';
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    clone.style.visibility = '';
    const targetCol = el ? el.closest('.column') : null;

    document.querySelectorAll('.column').forEach(c => {
      c.classList.remove('col-drag-over-before', 'col-drag-over-after');
    });

    if (targetCol && targetCol !== columnTouchDrag.column && targetCol.dataset.colId) {
      const rect = targetCol.getBoundingClientRect();
      const midpoint = rect.left + rect.width / 2;
      if (touch.clientX < midpoint) targetCol.classList.add('col-drag-over-before');
      else targetCol.classList.add('col-drag-over-after');
      columnTouchDrag.overColumn = targetCol;
      columnTouchDrag.overBefore = touch.clientX < midpoint;
    } else {
      columnTouchDrag.overColumn = null;
    }
  }

  function onColumnTouchEnd(e) {
    if (!columnTouchDrag) return;
    columnTouchDrag.column.classList.remove('col-dragging');
    document.querySelectorAll('.column').forEach(c => {
      c.classList.remove('col-drag-over-before', 'col-drag-over-after');
    });
    columnTouchDrag.clone.remove();

    if (columnTouchDrag.overColumn && columnTouchDrag.overColumn !== columnTouchDrag.column) {
      reorderColumn(
        columnTouchDrag.colId,
        columnTouchDrag.overColumn.dataset.colId,
        columnTouchDrag.overBefore
      );
      toast('Column reordered', 'success');
    }

    document.removeEventListener('touchmove', onColumnTouchMove);
    document.removeEventListener('touchend', onColumnTouchEnd);
    document.removeEventListener('touchcancel', onColumnTouchEnd);
    columnTouchDrag = null;
  }

  // ============ Utils ============
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ============ Events ============
  document.getElementById('taskForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const input = document.getElementById('taskInput');
    const text = input.value.trim();
    if (!text) return;
    const deadline = document.getElementById('taskDeadline').value;
    const priority = document.getElementById('taskPriority').value;
    addTask(text, deadline, priority);
    input.value = '';
    document.getElementById('taskDeadline').value = '';
    document.getElementById('taskPriority').value = 'medium';
    input.focus();
    toast('Task added to inbox', 'success');
  });

  document.getElementById('searchInput').addEventListener('input', () => renderBoard());

  document.getElementById('themeToggle').addEventListener('click', () => {
    state.theme = state.theme === 'light' ? 'dark' : 'light';
    save();
    applyTheme();
  });

  const clearBtn = document.getElementById('clearBtn');
  const clearDropdown = document.getElementById('clearDropdown');
  clearBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    clearDropdown.classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    if (!clearDropdown.contains(e.target)) clearDropdown.classList.remove('open');
  });
  clearDropdown.querySelectorAll('.dropdown-item').forEach(item => {
    item.addEventListener('click', async () => {
      const action = item.dataset.action;
      clearDropdown.classList.remove('open');
      if (action === 'clear-done') clearDone();
      else if (action === 'clear-all') clearAll();
      else if (action === 'delete-board') {
        const board = getActiveBoard();
        if (!board) return;
        const ok = await Modal.confirm({
          title: 'Delete this board?',
          message: '"' + board.name + '" and all its tasks will be permanently removed.',
          confirmText: 'Delete',
          icon: 'danger'
        });
        if (ok) deleteBoard(board.id);
      }
    });
  });

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.btn');
    if (!btn) return;
    const rect = btn.getBoundingClientRect();
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    const size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
    btn.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  });

  // ============ Init ============
  load();
  if (state.boards.length === 0) {
    const b1 = createDefaultBoard('Personal Projects');
    const b2 = createDefaultBoard('Work Sprint');
    state.boards = [b1, b2];
    state.activeBoardId = b1.id;

    b1.tasks.todo = [
      { id: state.taskCounter++, text: 'Design new portfolio layout', created: Date.now(), deadline: null, priority: 'medium' },
      { id: state.taskCounter++, text: 'Research UX trends for 2026', created: Date.now(), deadline: getFutureDate(5), priority: 'low' }
    ];
    b1.tasks.inprogress = [
      { id: state.taskCounter++, text: 'Refactor authentication module', created: Date.now(), deadline: getFutureDate(2), priority: 'high' }
    ];
    b1.tasks.done = [
      { id: state.taskCounter++, text: 'Set up project repository', created: Date.now() - 86400000, deadline: null, priority: 'medium' }
    ];
    b2.tasks.todo = [
      { id: state.taskCounter++, text: 'Prepare quarterly presentation', created: Date.now(), deadline: getFutureDate(-1), priority: 'critical' },
      { id: state.taskCounter++, text: 'Code review for PR #142', created: Date.now(), deadline: getFutureDate(1), priority: 'high' }
    ];
  }
  applyTheme();
  render();

  function getFutureDate(days) {
    const d = new Date();
    d.setDate(d.getDate() + days);
    return d.toISOString().split('T')[0];
  }

})();
</script>
